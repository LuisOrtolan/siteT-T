<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ficha — Trilhas &amp;Tesouros</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0
            }

            body {
                background: #0f1014;
                color: #f5f5f7;
                font-family: 'Georgia',serif;
                padding: 12px
            }

            input,select,textarea {
                font-family: inherit
            }

            #app {
                max-width: 600px;
                margin: 0 auto
            }

            .tt-top {
                text-align: center;
                padding: 8px 0 12px;
                border-bottom: 1px solid #2a2d35;
                margin-bottom: 12px
            }

            .tt-top h1 {
                font-size: 16px;
                color: #c7a25a;
                letter-spacing: .1em;
                font-weight: normal
            }

            .tt-top p {
                font-size: 10px;
                color: #5a5f70;
                margin-top: 3px
            }

            .tabs {
                display: flex;
                gap: 4px;
                margin-bottom: 12px
            }

            .tab {
                flex: 1;
                padding: 7px 4px;
                background: #181a20;
                border: 1px solid #2a2d35;
                border-radius: 7px;
                color: #6b7080;
                font-size: 11px;
                cursor: pointer;
                text-align: center;
                transition: all .15s
            }

            .tab.active {
                background: #c7a25a18;
                border-color: #c7a25a50;
                color: #c7a25a
            }

            .sec {
                background: #181a20;
                border: 1px solid #2a2d35;
                border-radius: 9px;
                padding: 12px;
                margin-bottom: 10px
            }

            .sec-t {
                font-size: 10px;
                font-weight: bold;
                letter-spacing: .12em;
                text-transform: uppercase;
                color: #c7a25a;
                margin-bottom: 9px
            }

            .g2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 7px
            }

            .g3 {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 7px
            }

            .g4 {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap: 7px
            }

            .fl {
                display: block;
                font-size: 10px;
                color: #6b7080;
                margin-bottom: 3px;
                letter-spacing: .04em
            }

            .fi {
                width: 100%;
                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 6px;
                padding: 5px 7px;
                color: #f5f5f7;
                font-size: 12px
            }

            .fi:focus {
                outline: none;
                border-color: #c7a25a60
            }

            .fi-sm {
                width: 100%;
                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 6px;
                padding: 5px;
                color: #f5f5f7;
                font-size: 13px;
                text-align: center
            }

            .fi-sm:focus {
                outline: none;
                border-color: #c7a25a60
            }

            select.fi option,select.fi-sm option {
                background: #181a20
            }

            .attr-box {
                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 8px;
                padding: 9px 7px;
                text-align: center
            }

            .attr-name {
                font-size: 12px;
                color: #c7a25a;
                letter-spacing: .1em;
                font-weight: bold;
                display: block;
                margin-bottom: 7px
            }

            .attr-fields {
                display: flex;
                gap: 5px;
                justify-content: center;
                margin-bottom: 5px
            }

            .attr-col {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                flex: 1
            }

            .attr-col-lbl {
                font-size: 9px;
                color: #5a5f70;
                letter-spacing: .04em
            }

            .attr-col input {
                width: 100%;
                background: #181a20;
                border: 1px solid #2a2d35;
                border-radius: 5px;
                color: #f5f5f7;
                font-size: 16px;
                text-align: center;
                padding: 4px 2px
            }

            .attr-col input:focus {
                outline: none;
                border-color: #c7a25a60
            }

            .attr-col.atual input {
                font-size: 18px
            }

            .attr-mod-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                margin-top: 2px
            }

            .attr-mod-lbl {
                font-size: 9px;
                color: #5a5f70
            }

            .attr-mod-val {
                font-size: 12px;
                font-weight: bold
            }

            .stat-box {
                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 7px;
                padding: 8px 6px;
                text-align: center
            }

            .stat-lbl {
                font-size: 10px;
                color: #c7a25a;
                letter-spacing: .1em;
                font-weight: bold;
                display: block;
                margin-bottom: 5px
            }

            .stat-row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 4px
            }

            .stat-row input {
                width: 38px;
                background: transparent;
                border: none;
                border-bottom: 1px solid #2a2d35;
                color: #f5f5f7;
                font-size: 18px;
                text-align: center;
                padding: 0
            }

            .stat-row input:focus {
                outline: none;
                border-color: #c7a25a
            }

            .stat-sep {
                color: #3a3f50;
                font-size: 14px
            }

            .pv-bar-bg {
                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 20px;
                height: 10px;
                overflow: hidden;
                margin-top: 5px
            }

            .pv-bar-fill {
                height: 100%;
                border-radius: 20px;
                transition: width .3s,background .3s
            }

            .btn {
                background: #1f2230;
                border: 1px solid #2a2d35;
                border-radius: 6px;
                color: #f5f5f7;
                font-size: 12px;
                padding: 5px 9px;
                cursor: pointer;
                transition: background .15s
            }

            .btn:hover {

            }

            .btn.gold {
                background: #c7a25a15;
                border-color: #c7a25a40;
                color: #c7a25a
            }

            .btn.gold:hover {
                background: #c7a25a25
            }

            .btn.red {
                background: #d0606018;
                border-color: #d0606040;
                color: #d06060
            }

            .btn.red:hover {
                background: #d0606028
            }

            .btn.sm {
                font-size: 15px;
                padding: 2px 9px;
                font-weight: bold
            }

            .btn-secondary {
                background: #c7a25a15;
                border-color: #c7a25a40;
                color: #c7a25a
            }

            .btn-secondary:hover {

            }

            .tt-auth-fixed {
                position: fixed;
                top: 8px;
                right: 8px;
                z-index: 100;
                background: #181a20;
                border: 1px solid #2a2d35;
                border-radius: 9px;
                padding: 6px 8px;
                max-width: 220px

            .tt-auth-form {
                display: flex;
                gap: 4px

            .tt-auth-form input {
                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 5px;
                padding: 4px 6px;
                color: #f5f5f7;
                font-size: 11px;
                width: 120px

            .tt-auth-msg {
                font-size: 10px;
                color: #8a8fa0;
                margin-top: 3px
            }

            .tt-auth-email {
                font-size: 11px;
                color: #b0b3c0;
                margin-right: 6px
            }

            .toggle {
                width: 36px;
                height: 20px;
                background: #2a2d35;
                border-radius: 20px;
                cursor: pointer;
                position: relative;
                transition: background .2s;
                flex-shrink: 0;
                border: none
            }

            .toggle.on {
                background: #c7a25a40
            }

            .toggle::after {
                content: '';
                position: absolute;
                width: 14px;
                height: 14px;
                background: #6b7080;
                border-radius: 50%;
                top: 3px;
                left: 3px;
                transition: transform .2s,background .2s
            }

            .toggle.on::after {
                transform: translateX(16px);
                background: #c7a25a
            }

            .arma-row {
                display: grid;
                grid-template-columns: 1.4fr 0.8fr 0.8fr 0.8fr 3fr;
                gap: 5px;
                align-items: center;
                padding: 5px 0;
                border-bottom: 1px solid #1a1d24
            }

            .arma-row:last-child {
                border-bottom: none
            }

            .col-h {
                font-size: 9px;
                color: #5a5f70;
                text-align: center
            }

            .trilha-row {
                display: grid;
                grid-template-columns: 2fr 1fr 1fr 1fr;
                gap: 6px;
                align-items: center;
                padding: 6px 0;
                border-bottom: 1px solid #1a1d24
            }

            .trilha-row:last-child {
                border-bottom: none
            }

                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 7px;
                overflow: hidden

            .slot-item {

                border-bottom: none

                border: none;
                color: #d0d3dc;
                font-size: 12px;

                font-family: inherit
            }

            .slot-item input.iname:focus {
                outline: none
            }

            .slot-item input.inum,.slot-item input.islot {
                background: #181a20;
                border: 1px solid #2a2d35;
                border-radius: 5px;

                text-align: center;

                width: 100%;
                font-family: inherit
            }

            .slot-item input.inum {
                color: #d0d3dc
            }

            .slot-item input.islot {

                margin-top: 7px
            }

            .slot-add input.main {

                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 6px;
                padding: 5px 7px;
                color: #f5f5f7;
                font-size: 12px;
                font-family: inherit
            }

            .slot-add input.main:focus {

            }

            .slot-add input.sm2 {

                background: #0f1014;
                border: 1px solid #2a2d35;
                border-radius: 6px;
                padding: 5px 4px;

            .slot-bar-bg {

                border: 1px solid #2a2d35;
                border-radius: 20px;
                height: 8px;
                overflow: hidden;

            .slot-bar-fill {

                padding: 3px 9px;
                border-radius: 20px;
                font-size: 10px;
                font-weight: bold;
                letter-spacing: .05em;

                border-color: #3a8a3a60;
                color: #5aaf5a
            }

            .carga-media {
                background: #c7a25a18;
                border-color: #c7a25a60;
                color: #c7a25a
            }

            .carga-pesada {
                background: #d0606018;
                border-color: #d0606060;
                color: #d06060

            .carga-sobre {
                background: #8a203018;

                color: #e04060
            }

            .carga-vazia {

                color: #5a5f70
            }

                border: 1px solid #2a2d35;

            .proj-row {

            .proj-row:last-child {

            }

            .proj-name {

                flex: 1;
                background: transparent;

                font-family: inherit;

            .proj-name:focus {

            }

            .proj-ctrl {
                display: flex;

            .proj-ctrl input {

                border: 1px solid #2a2d35;
                border-radius: 5px;
                color: #f5f5f7;
                font-size: 16px;
                text-align: center;
                padding: 3px;
                font-family: inherit
            }

            .proj-ctrl input:focus {
                outline: none;
                border-color: #c7a25a60
            }

            .proj-add-row {
                display: flex;
                gap: 5px;
                margin-top: 8px
            }

            .proj-add-row input {

                border: 1px solid #2a2d35;
                border-radius: 6px;
                padding: 5px 7px;
                color: #f5f5f7;
                font-size: 12px;
                font-family: inherit
            }

            .proj-add-row input:focus {

                border-color: #c7a25a60
            }

            .mov-table {
                width: 100%;
                font-size: 11px;
                border-collapse: collapse
            }

            .mov-table th {

            .mag-results {

                overflow-y: auto;

                justify-content: space-between;

                flex-direction: column;
                min-width: 0

            .mag-row-name {
                font-size: 12px;
                color: #f5f5f7

            .mag-row-meta {
                font-size: 10px;
                color: #8a8fa0

        </style>
    <body>
        <div id="tt-auth" class="tt-auth-fixed"></div>
        <div id="app"></div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <script src="../js/supabase-config.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/ficha-store.js"></script>
        <script>
            const TL = TT_FICHA.TL;
            function def() {
                return TT_FICHA.def();
            }
            function mod(v) {
                const n = parseInt(v) || 10;
                if (n <= 3)
                    return '-3';
                if (n <= 5)
                    return '-2';
                if (n <= 8)
                    return '-1';
                if (n <= 12)
                    return '0';
                if (n <= 15)
                    return '+1';
                if (n <= 17)
                    return '+2';
                return '+3';
            }
            function modColor(v) {
                const n = parseInt(v) || 10;
                if (n <= 8)
                    return '#d06060';
                if (n <= 12)
                    return '#8a8fa0';
                return '#5aaf5a';
            }
            function pvColor(p, mx) {
                const r = mx > 0 ? p / mx : 0;
                return r > 0.6 ? '#3a8a3a' : r > 0.3 ? '#c7a25a' : '#d06060';
            }
            function fmtSlot(v) {
                const n = parseFloat(v) || 0;
                return n === Math.floor(n) ? String(n) : n.toFixed(1);
            }
            function totalSlots(arr) {
                return arr.reduce( (a, x) => a + (parseFloat(x.slots) || 0), 0);
            }
            function cargaInfo(used) {
                const c = S.carga
                  , l = parseFloat(c.leve) || 0
                  , m = parseFloat(c.media) || 0
                  , p = parseFloat(c.pesada) || 0
                  , s = parseFloat(c.sobre) || 0;
                if (!l && !m && !p && !s)
                    return {
                        badge: '<span class="carga-badge carga-vazia">sem limites definidos</span>',
                        color: '#3a8a3a',
                        ref: 0
                    };
                if (p && used > p)

                }
                ).join('') + '</div></div>' +
                '<div class="sec"><div class="sec-t">Defesas</div><div class="g3">' + '<div class="stat-box"><span class="stat-lbl">CA</span><div class="stat-row"><input type="number" value="' + S.ca + '" onchange="S.ca=parseInt(this.value)||10;save()"/></div><div style="font-size:9px;color:#5a5f70;margin-top:3px">classe de armadura</div></div>' + '<div class="stat-box"><span class="stat-lbl">SF</span><div class="stat-row"><input type="number" value="' + S.sf + '" onchange="S.sf=parseInt(this.value)||10;save()"/></div><div style="font-size:9px;color:#5a5f70;margin-top:3px">salvaguarda física</div></div>' + '<div class="stat-box"><span class="stat-lbl">SM</span><div class="stat-row"><input type="number" value="' + S.sm + '" onchange="S.sm=parseInt(this.value)||10;save()"/></div><div style="font-size:9px;color:#5a5f70;margin-top:3px">salvaguarda mental</div></div>' + '</div></div>' +
                '<div class="sec"><div class="sec-t">Vitalidade</div><div class="g2">' + '<div class="stat-box"><span class="stat-lbl">PV\'s</span>' + '<div class="stat-row"><input type="number" min="0" value="' + S.pv.v + '" onchange="S.pv.v=Math.max(0,parseInt(this.value)||0);save();render()"/><span class="stat-sep">/</span>' + '<input type="number" min="1" value="' + S.pv.max + '" onchange="S.pv.max=Math.max(1,parseInt(this.value)||1);save();render()"/></div>' + '<div class="pv-bar-bg"><div class="pv-bar-fill" style="width:' + Math.round(pvP * 100) + '%;background:' + pvColor(S.pv.v, S.pv.max) + '"></div></div>' + '<div style="display:flex;gap:5px;justify-content:center;margin-top:7px;align-items:center">' + '<button class="btn sm red" onclick="adjPV(-pvD)">−</button>' + '<input type="number" min="1" value="' + pvD + '" oninput="pvD=Math.max(1,parseInt(this.value)||1)" style="width:40px;background:#0f1014;border:1px solid #2a2d35;border-radius:5px;padding:3px;color:#f5f5f7;font-size:12px;text-align:center;font-family:inherit"/>' + '<button class="btn sm gold" onclick="adjPV(pvD)">+</button></div></div>' + '<div class="stat-box"><span class="stat-lbl">SORTE / FORTUNA</span>' + '<div class="stat-row"><input type="number" min="0" value="' + S.sorte.v + '" onchange="S.sorte.v=parseInt(this.value)||0;save()"/><span class="stat-sep">/</span>' + '<input type="number" min="0" value="' + S.sorte.max + '" onchange="S.sorte.max=parseInt(this.value)||0;save()"/></div>' + '<div style="font-size:9px;color:#5a5f70;margin-top:4px">atual / máximo</div>' + '<div style="display:flex;gap:5px;justify-content:center;margin-top:8px">' + '<button class="btn sm red" onclick="S.sorte.v=Math.max(0,S.sorte.v-1);save();render()">−</button>' + '<button class="btn sm gold" onclick="S.sorte.v=Math.min(S.sorte.max,S.sorte.v+1);save();render()">+</button>' + '</div></div></div></div>' +
                '<div class="sec"><div class="sec-t">Armas</div>' + '<div style="display:grid;grid-template-columns:1.4fr 0.8fr 0.8fr 0.8fr 3fr;gap:4px;margin-bottom:5px">' + ['Nome', 'Ataque', 'Dano', 'Alcance', 'Obs.'].map(h => '<div class="col-h">' + h + '</div>').join('') + '</div>' + S.armas.map( (a, i) => '<div class="arma-row">' + '<input class="fi" value="' + a.nome + '" oninput="updA(' + i + ',\'nome\',this.value)" placeholder="—"/>' + '<input class="fi-sm" value="' + a.ataque + '" oninput="updA(' + i + ',\'ataque\',this.value)" placeholder="—"/>' + '<input class="fi-sm" value="' + a.dano + '" oninput="updA(' + i + ',\'dano\',this.value)" placeholder="—"/>' + '<input class="fi-sm" value="' + a.alcance + '" oninput="updA(' + i + ',\'alcance\',this.value)" placeholder="—"/>' + '<div style="display:flex;gap:4px"><input class="fi" value="' + a.obs + '" oninput="updA(' + i + ',\'obs\',this.value)" placeholder="—"/>' + (S.armas.length > 1 ? '<button class="btn red" onclick="rmA(' + i + ')" style="padding:4px 7px;flex-shrink:0">✕</button>' : '') + '</div></div>').join('') + '<button class="btn gold" onclick="addA()" style="margin-top:8px;width:100%">+ Adicionar arma</button></div>' +
                '<div class="sec"><div class="sec-t">Contadores</div>' + '<div class="proj-box">' + (S.contadores.length ? S.contadores.map( (p, i) => '<div class="proj-row">' + '<input class="proj-name" value="' + p.nome + '" oninput="updCNome(' + i + ',this.value)"/>' + '<div class="proj-ctrl"><button class="btn sm red" onclick="adjC(' + i + ',-1)">−</button>' + '<input type="number" min="0" value="' + p.qtd + '" oninput="updC(' + i + ',this.value)"/>' + '<button class="btn sm gold" onclick="adjC(' + i + ',1)">+</button>' + '<button class="btn" onclick="rmC(' + i + ')" style="padding:3px 7px;color:#d06060;margin-left:4px">✕</button>' + '</div></div>').join('') : '<div class="empty-hint" style="padding:6px 0">Nenhum contador — adicione flechas, virotes, usos…</div>') + '</div><div class="proj-add-row">' + '<input placeholder="Ex: Flechas, Virotes, Cargas de Mana…" value="' + ns.cont + '" oninput="ns.cont=this.value" onkeydown="if(event.key===\'Enter\')addC()"/>' + '<button class="btn gold" onclick="addC()">+ Add</button></div></div>';
            }

            function tab1() {
                return '<div class="sec"><div class="sec-t">Trilha Principal</div>' + '<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:5px;margin-bottom:5px">' + ['Nome', 'Rank', 'Ouro Gasto', 'Ataques'].map(h => '<div class="col-h" style="text-align:left">' + h + '</div>').join('') + '</div>' + '<div class="trilha-row">' + trSel(S.trilha_principal.nome, "S.trilha_principal.nome=this.value;save()") + '<input class="fi-sm" type="number" min="1" value="' + S.trilha_principal.rank + '" onchange="S.trilha_principal.rank=parseInt(this.value)||1;save()"/>' + '<input class="fi-sm" value="' + S.trilha_principal.ouro + '" oninput="S.trilha_principal.ouro=this.value;save()" placeholder="0"/>' + '<input class="fi-sm" value="' + S.trilha_principal.ataques + '" oninput="S.trilha_principal.ataques=this.value;save()" placeholder="—"/>' + '</div></div>' + '<div class="sec"><div class="sec-t">Trilhas Secundárias</div>' + '<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:5px;margin-bottom:5px">' + ['Nome', 'Rank', 'Ouro Gasto', 'Ataques'].map(h => '<div class="col-h" style="text-align:left">' + h + '</div>').join('') + '</div>' + S.trilhas.map( (t, i) => '<div class="trilha-row">' + trSel(t.nome, "updTr(" + i + ",'nome',this.value)") + '<input class="fi-sm" type="number" min="1" value="' + t.rank + '" onchange="updTr(' + i + ',\'rank\',parseInt(this.value)||1)"/>' + '<input class="fi-sm" value="' + t.ouro + '" oninput="updTr(' + i + ',\'ouro\',this.value)" placeholder="0"/>' + '<div style="display:flex;gap:4px"><input class="fi-sm" value="' + t.ataques + '" oninput="updTr(' + i + ',\'ataques\',this.value)" placeholder="—"/>' + (S.trilhas.length > 1 ? '<button class="btn red" onclick="rmTr(' + i + ')" style="padding:3px 7px;flex-shrink:0">✕</button>' : '') + '</div></div>').join('') + '<button class="btn gold" onclick="addTr()" style="margin-top:8px;width:100%">+ Trilha</button></div>' + '<div class="sec"><div class="sec-t">Magias — Feitiços, Rituais, Milagres, Runas, Músicas, Fórmulas…</div>' + sL('magia', S.magias, 'Nome da magia, ritual, runa…') + '<button class="btn" style="margin-top:8px;width:100%" onclick="toggleMagPicker()">' + (magPickerOpen ? '▲ Fechar lista de magias' : '🔍 Escolher de uma lista por trilha') + '</button>' + (magPickerOpen ? renderMagPicker() : '') + '</div>' + '<div class="sec"><div class="sec-t">Habilidades e Características</div>' + sL('hab', S.habilidades, 'Nova habilidade ou característica…') + '</div>' + '<div class="sec"><div class="sec-t">Idiomas</div>' + sL('idioma', S.idiomas, 'Idioma…') + '</div>';
            }

            function tab2() {
                return '<div class="sec"><div class="sec-t">Equipamentos</div>' + slotSec('e', S.equip.items, 'Carga atual') + '</div>' + '<div class="sec"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:' + (S.equip.tem_mochila ? '10px' : '2px') + '">' + '<div class="sec-t" style="margin-bottom:0">Mochila</div>' + '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#6b7080">Tem mochila?</span>' + '<button class="toggle' + (S.equip.tem_mochila ? ' on' : '') + '" onclick="S.equip.tem_mochila=!S.equip.tem_mochila;save();render()"></button></div></div>' + (S.equip.tem_mochila ? '<div style="margin-bottom:9px;display:flex;align-items:center;gap:8px">' + '<span style="font-size:10px;color:#6b7080">Capacidade interna:</span>' + '<input type="number" min="0" step="1" value="' + S.equip.mochila_slots + '" onchange="S.equip.mochila_slots=parseInt(this.value)||0;save();render()" style="width:46px;background:#0f1014;border:1px solid #2a2d35;border-radius:5px;padding:2px 4px;color:#f5f5f7;font-size:12px;text-align:center;font-family:inherit"/>' + '<span style="font-size:10px;color:#6b7080">slots</span></div>' + slotSec('m', S.equip.mochila, 'Carga na mochila') : '<div style="font-size:11px;color:#3a3f50;padding:4px 0">Personagem sem mochila.</div>') + '</div>' + '<div class="sec"><div class="sec-t">Moedas</div><div class="moeda-grid">' + [['cobre', 'Cobre'], ['prata', 'Prata'], ['ouro', 'Ouro'], ['electrum', 'Eléctrum'], ['platina', 'Platina']].map( ([k,l]) => '<div class="moeda-box"><span class="moeda-lbl">' + l + '</span><input type="number" min="0" value="' + S.moedas[k] + '" onchange="S.moedas[\'' + k + '\']=parseInt(this.value)||0;save()"/></div>').join('') + '</div><div style="margin-top:8px"><label class="fl">PEDRAS PRECIOSAS</label><input class="fi" value="' + S.pedras + '" oninput="S.pedras=this.value;save()" placeholder="Descreva as pedras…"/></div></div>' + '<div class="sec"><div class="sec-t">Carga e Movimento</div>' + '<table class="mov-table"><tr><th></th><th>Leve</th><th>Média</th><th>Pesada¹</th><th>Sobrecarga²</th></tr>' + '<tr><td>Mov. Base</td><td>40\'</td><td>30\'</td><td>20\'</td><td>10\'</td></tr>' + '<tr><td>Especial</td><td>20\'</td><td>15\'</td><td>10\'</td><td>—</td></tr>' + '<tr><td>Exploração</td><td>120\'</td><td>90\'</td><td>60\'</td><td>30\'</td></tr>' + '<tr><td>Viagem/dia</td><td>20mi</td><td>15mi</td><td>10mi</td><td>5mi</td></tr>' + '<tr><td style="color:#c7a25a;font-weight:bold">Meus slots</td>' + ['leve', 'media', 'pesada', 'sobre'].map(k => '<td><input class="cinput" type="number" min="0" step="0.5" placeholder="—" value="' + (S.carga[k] || '') + '" onchange="S.carga[\'' + k + '\']=this.value;save();render()"/></td>').join('') + '</tr></table>' + '<div style="font-size:9px;color:#5a5f70;margin-top:6px;line-height:1.5">Preencha <em>Meus slots</em> para ver o badge de faixa nos Equipamentos.<br>¹ Não pode usar mod. positivo de DES na CA &nbsp;² −2 nos testes físicos</div></div>';
            }

            function tab3() {
                return '<div class="sec"><div class="sec-t">Anotações</div>' + '<textarea class="notes" oninput="S.anotacoes=this.value;save()" placeholder="Anotações livres, história, contatos, recompensas, pistas…">' + S.anotacoes + '</textarea></div>' + '<div class="sec"><div class="sec-t">Ficha</div>' + '<div class="actions"><button class="btn gold" onclick="doExport()">⬇ Exportar JSON</button>' + '<button class="btn" onclick="doImport()">⬆ Importar JSON</button>' + '<button class="btn red" onclick="apagarPersonagem(\'' + S.id + '\')">🗑 Apagar personagem</button></div>' + '<div class="save-ind" id="si">✓ salvo automaticamente</div></div>';
            }

            function renderCatalogo() {
                const cards = roster.length ? roster.map(c => {
                    const nome = c.nome ? c.nome : 'Personagem sem nome';
                    const trilha = (c.trilha_principal && c.trilha_principal.nome && c.trilha_principal.nome !== '—') ? c.trilha_principal.nome : null;
                    const meta = 'Nível ' + (c.nivel || 1) + (trilha ? ' · ' + trilha : '');
                    return '<div class="char-card">' + '<div class="char-card-main" onclick="openChar(\'' + c.id + '\')">' + '<div class="char-card-name">' + nome + '</div>' + '<div class="char-card-meta">' + meta + '</div></div>' + '<div class="char-card-actions">' + '<button class="btn sm" title="Duplicar" onclick="event.stopPropagation();duplicarPersonagem(\'' + c.id + '\')">⧉</button>' + '<button class="btn sm red" title="Apagar" onclick="event.stopPropagation();apagarPersonagem(\'' + c.id + '\')">✕</button>' + '</div></div>';
                }
                ).join('') : '<div class="empty-hint" style="padding:22px 10px">Nenhum personagem salvo ainda. Crie o primeiro!</div>';
                return '<div class="tt-top"><h1>⚔ TRILHAS &amp; TESOUROS</h1><p>MEUS PERSONAGENS</p></div>' + '<div class="sec"><button class="btn gold" style="width:100%" onclick="novoPersonagem()">+ Novo Personagem</button></div>' + '<div class="char-list">' + cards + '</div>' + '<div class="sec"><div class="sec-t">Backup</div>' + '<div class="actions"><button class="btn" onclick="doExportTudo()">⬇ Exportar tudo</button>' + '<button class="btn" onclick="doImportCatalogo()">⬆ Importar</button></div></div>';
            }

            function render() {
                const app = document.getElementById('app');
                if (view === 'catalogo') {
                    app.innerHTML = renderCatalogo();
                    return;
                }
                const tabs = ['Personagem', 'Trilhas', 'Inventário', 'Notas'];
                app.innerHTML = '<div class="tt-top"><div class="back-row"><button class="btn sm" onclick="backToCatalogo()">← Personagens</button>' + '<span style="display:flex;align-items:center;gap:6px"><span class="save-ind-inline" id="si2"></span><button class="btn gold sm" onclick="manualSave()">💾 Salvar</button></span></div>' + '<h1>⚔ TRILHAS &amp; TESOUROS</h1><p>' + (S.nome ? S.nome : 'FICHA DE PERSONAGEM DIGITAL') + '</p></div>' + '<div class="tabs">' + tabs.map( (t, i) => '<div class="tab' + (i === tab ? ' active' : '') + '" onclick="tab=' + i + ';render()">' + t + '</div>').join('') + '</div>' + (tab === 0 ? tab0() : tab === 1 ? tab1() : tab === 2 ? tab2() : tab3());
            }
            render();

            if (window.TT_AUTH) {
                TT_AUTH.mountWidget('#tt-auth');
                TT_AUTH.onChange(function (session) {
                    if (!session) return;
                    TT_FICHA.mergeWithCloud(roster).then(function (merged) {
                        roster = merged;
                        if (curId && !roster.some(c => c.id === curId)) backToCatalogo();
                        else render();
                    });
                });
            }
        </script>
    </body>
</html>
