<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa Virtual — Trilhas &amp; Tesouros</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { height: 100% }
    body {
      background: #0f1014;
      color: #f5f5f7;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }
    input, select, textarea, button { font-family: inherit }

    #app { height: 100vh; display: flex; flex-direction: column }

    .tt-auth-fixed {
      position: fixed; top: 8px; right: 8px; z-index: 200;
      background: #181a20; border: 1px solid #2a2d35; border-radius: 9px;
      padding: 6px 8px; max-width: 220px;
    }
    .tt-auth-form { display: flex; gap: 4px }
    .tt-auth-form input {
      background: #0f1014; border: 1px solid #2a2d35; border-radius: 5px;
      padding: 4px 6px; color: #f5f5f7; font-size: 11px; width: 120px;
    }
    .tt-auth-msg { font-size: 10px; color: #8a8fa0; margin-top: 3px }
    .tt-auth-email { font-size: 11px; color: #b0b3c0; margin-right: 6px }
    .btn-secondary { background: #c7a25a15; border-color: #c7a25a40; color: #c7a25a }
    .btn-secondary:hover { background: #c7a25a25 }

    .btn {
      background: #1f2230; border: 1px solid #2a2d35; border-radius: 6px;
      color: #f5f5f7; font-size: 12px; padding: 6px 10px; cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #2a2d3e }
    .btn.gold { background: #c7a25a15; border-color: #c7a25a40; color: #c7a25a }
    .btn.gold:hover { background: #c7a25a25 }
    .btn.on { background: #c7a25a30; border-color: #c7a25a; color: #c7a25a }
    .btn.red { background: #d0606018; border-color: #d0606040; color: #d06060 }
    .btn.red:hover { background: #d0606028 }
    .btn:disabled { opacity: .4; cursor: default }

    /* ---- Landing ---- */
    .landing-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 16px; overflow-y: auto;
    }
    .landing-card { max-width: 420px; width: 100%; }
    .tt-top { text-align: center; padding: 8px 0 18px }
    .tt-top h1 { font-size: 18px; color: #c7a25a; letter-spacing: .08em; font-weight: normal }
    .tt-top p { font-size: 11px; color: #5a5f70; margin-top: 4px }
    .sec {
      background: #181a20; border: 1px solid #2a2d35; border-radius: 9px;
      padding: 14px; margin-bottom: 12px;
    }
    .sec-t { font-size: 12px; color: #c7a25a; margin-bottom: 8px; letter-spacing: .04em }
    .fi {
      width: 100%; background: #0f1014; border: 1px solid #2a2d35; border-radius: 6px;
      padding: 8px 10px; color: #f5f5f7; font-size: 13px; margin-bottom: 8px;
    }
    .fi:focus { outline: none; border-color: #c7a25a60 }
    .hint { font-size: 10px; color: #5a5f70; margin-top: 4px }
    .err { font-size: 11px; color: #d06060; margin-top: 4px }

    .room-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #1a1d24 }
    .room-item:last-child { border-bottom: none }
    .room-item-info { display: flex; flex-direction: column; min-width: 0 }
    .room-item-info b { font-size: 13px; color: #f5f5f7; font-weight: normal }
    .room-item-meta { font-size: 10px; color: #6b7080 }

    /* ---- Room layout ---- */
    /* padding-top livra o cabeçalho do badge de login (fixo, top-right) */
    .room { flex: 1; display: flex; min-height: 0; padding-top: 48px }
    .room-main { flex: 1; display: flex; flex-direction: column; min-width: 0 }
    .room-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid #1f2230; flex-wrap: wrap;
    }
    .room-header h1 { font-size: 14px; color: #c7a25a; font-weight: normal }
    .room-code { font-size: 11px; color: #6b7080 }
    .room-code b { color: #b0b3c0; letter-spacing: .1em }

    .toolbar {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-bottom: 1px solid #1f2230; flex-wrap: wrap;
    }
    .toolbar input[type=color] {
      width: 30px; height: 30px; border: 1px solid #2a2d35; border-radius: 6px;
      background: none; padding: 0; cursor: pointer;
    }
    .toolbar input[type=range] { width: 80px }
    .toolbar .lbl { font-size: 10px; color: #6b7080 }

    .board-wrap { flex: 1; position: relative; overflow: auto; background: #08090c }
    .board-inner { position: relative }
    .board-grid { position: absolute; inset: 0; }
    .board-canvas { position: absolute; inset: 0; touch-action: none; cursor: crosshair }
    .board-canvas.erase-mode { cursor: not-allowed }
    .board-canvas.pan-mode { cursor: grab }
    .board-canvas.pan-mode:active { cursor: grabbing }
    .zoom-label { font-size: 11px; color: #b0b3c0; min-width: 34px; text-align: center }

    .sidebar {
      width: 320px; flex-shrink: 0; border-left: 1px solid #1f2230;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar .sec { margin: 10px; margin-bottom: 0 }
    .sidebar .sec:last-child { margin-bottom: 10px }

    .notes-area {
      width: 100%; min-height: 220px; background: #0f1014; border: 1px solid #2a2d35;
      border-radius: 6px; padding: 8px; color: #f5f5f7; font-size: 12px; resize: vertical;
    }
    .notes-area:focus { outline: none; border-color: #c7a25a60 }

    .dice-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px }
    .dice-presets .btn { padding: 8px 4px; text-align: center }
    .formula-row { display: flex; gap: 6px }
    .formula-row input { flex: 1 }

    .roll-log { max-height: 280px; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 6px }
    .roll-item { background: #0f1014; border: 1px solid #1a1d24; border-radius: 8px; padding: 6px 8px; font-size: 11px }
    .roll-item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 2px }
    .roll-item-head .who { color: #c7a25a; font-weight: bold }
    .roll-item-head .roll-time { color: #4a4f60; font-size: 9px; flex-shrink: 0 }
    .roll-item-body { display: flex; justify-content: space-between; align-items: baseline; gap: 6px }
    .roll-item-body .formula { color: #8a8fa0; overflow-wrap: anywhere }
    .roll-item-body .total { font-weight: bold; color: #f5f5f7; font-size: 14px; flex-shrink: 0 }

    .participant-list { display: flex; flex-direction: column; gap: 4px }
    .participant { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #b0b3c0 }
    .participant .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a8a3a; flex-shrink: 0 }
    .participant .gm-tag { font-size: 9px; color: #c7a25a; border: 1px solid #c7a25a40; border-radius: 4px; padding: 0 4px }

    @media (max-width: 760px) {
      .room { flex-direction: column }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid #1f2230; max-height: 45vh }
      .board-wrap { flex: 1 1 40vh }
    }
  </style>
</head>
<body>
  <div id="tt-auth" class="tt-auth-fixed"></div>
  <div id="tt-gate"></div>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dice.js"></script>
  <script src="../js/sala-store.js"></script>
  <script>
    // ---------- Estado ----------
    let view = 'landing';
    let sala = null;
    let meuUserId = null;
    let meuNome = '';
    let souGM = false;
    let desenhos = [];
    let rolagens = [];
    let anotacoesTexto = '';
    let notesTimer = null;
    let participantes = {};
    let channel = null;

    let tool = 'traco';
    let corAtual = '#c7a25a';
    let espessuraAtual = 4;
    let desenhando = false;
    let pontosAtuais = [];
    let previewEl = null;
    let zoom = 1;
    let panning = false;
    let panStart = null;
    let minhasSalas = [];

    const app = document.getElementById('app');

    // ---------- Boot ----------
    // O acesso à Mesa Virtual exige login — nada é renderizado em #app até
    // TT_AUTH.mountAuthGate confirmar uma sessão.
    function boot() {
      if (!window.TT_AUTH) return;
      TT_AUTH.mountUserBadge('#tt-auth');
      const codigoUrl = new URLSearchParams(location.search).get('sala');
      TT_AUTH.mountAuthGate('#tt-gate', function (session) {
        meuUserId = session.user.id;
        if (view === 'landing') renderLanding(codigoUrl || '');
      });
    }

    // ---------- Landing ----------
    function renderLanding(codigoPreenchido) {
      view = 'landing';
      app.innerHTML =
        '<div class="landing-wrap"><div class="landing-card">' +
        '<div class="back-row" style="margin-bottom:4px"><a class="btn" href="../index.html">&#8592; Site</a></div>' +
        '<div class="tt-top"><h1>&#9876; MESA VIRTUAL</h1><p>Quadro colaborativo, anotações e dados — em tempo real</p></div>' +
        '<div class="sec" id="my-rooms-sec" style="display:none"><div class="sec-t">Minhas salas</div><div id="my-rooms-list"></div></div>' +
        '<div class="sec"><div class="sec-t">Criar sala</div>' +
        '<input class="fi" id="ln-nomesala" placeholder="Nome da sala (ex: Caverna do Dragão)" maxlength="60">' +
        '<input class="fi" id="ln-meunome1" placeholder="Seu nome de personagem" maxlength="40">' +
        '<button class="btn gold" style="width:100%" onclick="doCreateRoom()">Criar sala</button>' +
        '<div class="err" id="ln-err1"></div></div>' +
        '<div class="sec"><div class="sec-t">Entrar com código</div>' +
        '<input class="fi" id="ln-codigo" placeholder="Código da sala" maxlength="6" style="text-transform:uppercase" value="' + (codigoPreenchido || '') + '">' +
        '<input class="fi" id="ln-meunome2" placeholder="Seu nome de personagem" maxlength="40">' +
        '<button class="btn gold" style="width:100%" onclick="doJoinRoom()">Entrar</button>' +
        '<div class="err" id="ln-err2"></div></div>' +
        '</div></div>';
      loadMyRooms();
    }

    function loadMyRooms() {
      TT_SALA.listMyRooms().then(function (rooms) {
        minhasSalas = rooms;
        const sec = document.getElementById('my-rooms-sec');
        const list = document.getElementById('my-rooms-list');
        if (!sec || !list) return;
        if (!rooms.length) { sec.style.display = 'none'; return; }
        sec.style.display = 'block';
        list.innerHTML = rooms.map(function (r) {
          return '<div class="room-item"><div class="room-item-info"><b>' + escapeHtml(r.nome || 'Mesa sem nome') + '</b>' +
            '<span class="room-item-meta">' + r.id + (r.souGM ? ' · você é o mestre' : '') + '</span></div>' +
            '<button class="btn gold" onclick="resumeRoom(\'' + r.id + '\')">Retomar</button></div>';
        }).join('');
      });
    }

    function resumeRoom(salaId) {
      const r = minhasSalas.find(function (x) { return x.id === salaId; });
      if (!r) return;
      enterRoom(salaId, r.meuNome);
    }

    // Traduz o motivo de uma falha do TT_SALA numa mensagem que ajuda a
    // diagnosticar (ex: RLS negando, tabela ausente porque o schema_mesa.sql
    // não foi rodado) sem expor jargão demais.
    function describeFail(res, fallback) {
      if (res.reason === 'logged-out') return 'Sua sessão expirou. Faça login de novo.';
      if (res.reason === 'no-auth') return 'Login não configurado neste site.';
      if (res.error && res.error.message) return fallback + ' (' + res.error.message + ')';
      return fallback;
    }

    function doCreateRoom() {
      const nomeSala = document.getElementById('ln-nomesala').value.trim();
      const nome = document.getElementById('ln-meunome1').value.trim();
      const err = document.getElementById('ln-err1');
      if (!nome) { err.textContent = 'Digite seu nome de personagem.'; return; }
      err.textContent = 'Criando...';
      TT_SALA.createRoom(nomeSala, nome).then(function (res) {
        if (!res.ok) { console.error('Falha ao criar sala:', res); err.textContent = describeFail(res, 'Não deu pra criar a sala. Tente de novo.'); return; }
        enterRoom(res.sala.id, nome);
      });
    }

    function doJoinRoom() {
      const codigo = document.getElementById('ln-codigo').value.trim().toUpperCase();
      const nome = document.getElementById('ln-meunome2').value.trim();
      const err = document.getElementById('ln-err2');
      if (!codigo) { err.textContent = 'Digite o código da sala.'; return; }
      if (!nome) { err.textContent = 'Digite seu nome de personagem.'; return; }
      err.textContent = 'Entrando...';
      TT_SALA.joinRoom(codigo, nome).then(function (res) {
        if (!res.ok) {
          console.error('Falha ao entrar na sala:', res);
          err.textContent = res.reason === 'not-found' ? 'Sala não encontrada. Confira o código.' : describeFail(res, 'Não deu pra entrar. Tente de novo.');
          return;
        }
        enterRoom(codigo, nome);
      });
    }

    function enterRoom(salaId, nome) {
      meuNome = nome;
      Promise.all([
        TT_SALA.getRoom(salaId),
        TT_SALA.listDrawings(salaId),
        TT_SALA.listRecentRolls(salaId, 100),
        TT_SALA.getNotes(salaId)
      ]).then(function (r) {
        sala = r[0];
        desenhos = r[1];
        rolagens = r[2];
        anotacoesTexto = r[3];
        souGM = sala && sala.gm_id === meuUserId;
        renderRoom();
        channel = TT_SALA.connect(salaId, meuNome, {
          onDrawAdd: handleDrawAdd,
          onDrawRemove: handleDrawRemove,
          onDrawClear: handleDrawClear,
          onRoll: handleRollBroadcast,
          onNotesUpdate: handleNotesBroadcast,
          onPresenceSync: handlePresenceSync
        });
      });
    }

    function leaveRoom() {
      if (channel) TT_SALA.leave(channel);
      channel = null;
      sala = null; desenhos = []; rolagens = []; participantes = {};
      history.replaceState(null, '', location.pathname);
      renderLanding();
    }

    // ---------- Room shell ----------
    function renderRoom() {
      view = 'room';
      const link = location.origin + location.pathname + '?sala=' + sala.id;
      app.innerHTML =
        '<div class="room">' +
          '<div class="room-main">' +
            '<div class="room-header">' +
              '<div style="display:flex;align-items:center;gap:10px">' +
                '<a class="btn" href="../index.html">&#8592; Site</a>' +
                '<div><h1>' + (sala.nome || 'Mesa sem nome') + '</h1>' +
                  '<span class="room-code">Código: <b>' + sala.id + '</b></span></div>' +
              '</div>' +
              '<div style="display:flex;gap:6px">' +
                '<button class="btn" onclick="copyLink()">&#128279; Copiar link</button>' +
                '<button class="btn red" onclick="leaveRoom()">Sair</button>' +
              '</div>' +
            '</div>' +
            '<div class="toolbar">' +
              toolBtn('traco', '&#9998; Caneta') + toolBtn('linha', '&#8211; Linha') +
              toolBtn('retangulo', '&#9633; Retângulo') + toolBtn('circulo', '&#9711; Círculo') +
              toolBtn('apagar', '&#10060; Apagar') + toolBtn('mover', '&#9995; Mover') +
              '<input type="color" id="tb-cor" value="' + corAtual + '" onchange="corAtual=this.value">' +
              '<span class="lbl">Espessura</span><input type="range" min="1" max="16" value="' + espessuraAtual + '" oninput="espessuraAtual=parseInt(this.value)">' +
              '<span class="lbl">Zoom</span>' +
              '<button class="btn" onclick="setZoom(zoom-0.25)">−</button>' +
              '<span class="zoom-label" id="zoom-label">100%</span>' +
              '<button class="btn" onclick="setZoom(zoom+0.25)">+</button>' +
              '<button class="btn" onclick="setZoom(1)">Redefinir</button>' +
              (souGM ? '<button class="btn red" onclick="doClearAll()">&#128465; Limpar tudo</button>' : '') +
              '<span class="lbl" style="margin-left:auto">Grade:</span>' +
              '<button class="btn' + (sala.grade_ativa ? ' on' : '') + '" id="grid-toggle-btn" onclick="toggleGrid()" ' + (souGM ? '' : 'disabled') + '>' + (sala.grade_ativa ? 'Ligada' : 'Desligada') + '</button>' +
            '</div>' +
            '<div class="board-wrap" id="board-wrap">' +
              '<div class="board-inner" id="board-inner">' +
                '<div class="board-grid" id="board-grid"></div>' +
                '<canvas class="board-canvas" id="board-canvas"></canvas>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="sidebar">' +
            '<div class="sec"><div class="sec-t">Anotações da sala</div>' +
              '<textarea class="notes-area" id="notes-area" oninput="onNotesInput()" placeholder="Anotações da aventura, visíveis e editáveis por todo mundo...">' + escapeHtml(anotacoesTexto) + '</textarea></div>' +
            '<div class="sec"><div class="sec-t">Dados</div>' +
              '<div class="dice-presets">' +
                ['d4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd66', '3d6'].map(function (n) {
                  return '<button class="btn gold" onclick="rollPresetClick(\'' + n + '\')">' + n + '</button>';
                }).join('') +
              '</div>' +
              '<div class="formula-row"><input class="fi" id="formula-input" placeholder="ex: 2d6+3" style="margin-bottom:0" onkeydown="if(event.key===\'Enter\')rollFormulaClick()">' +
              '<button class="btn gold" onclick="rollFormulaClick()">Rolar</button></div>' +
              '<div class="err" id="formula-err"></div>' +
              '<div class="roll-log" id="roll-log"></div>' +
            '</div>' +
            '<div class="sec"><div class="sec-t">Participantes</div><div class="participant-list" id="participant-list"></div></div>' +
          '</div>' +
        '</div>';

      renderRollLog();
      renderParticipants();
      initCanvas();
    }

    function toolBtn(name, label) {
      return '<button class="btn' + (tool === name ? ' on' : '') + '" data-tool="' + name + '" onclick="setTool(\'' + name + '\')">' + label + '</button>';
    }
    // Só troca a ferramenta ativa — não recria o canvas nem o resto do DOM
    // (recriar apagava traços que ainda não tinham sido confirmados, ver
    // onPointerUp).
    function setTool(name) {
      tool = name;
      document.querySelectorAll('.toolbar [data-tool]').forEach(function (b) {
        b.classList.toggle('on', b.dataset.tool === name);
      });
      const c = canvasEl();
      if (c) {
        c.classList.toggle('erase-mode', tool === 'apagar');
        c.classList.toggle('pan-mode', tool === 'mover');
      }
    }
    function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function copyLink() {
      const link = location.origin + location.pathname + '?sala=' + sala.id;
      history.replaceState(null, '', link);
      if (navigator.clipboard) navigator.clipboard.writeText(link).catch(function () {});
    }

    function toggleGrid() {
      sala.grade_ativa = !sala.grade_ativa;
      TT_SALA.updateGrid(sala.id, { ativa: sala.grade_ativa });
      const grid = document.getElementById('board-grid');
      if (grid) grid.style.display = sala.grade_ativa ? 'block' : 'none';
      const btn = document.getElementById('grid-toggle-btn');
      if (btn) { btn.textContent = sala.grade_ativa ? 'Ligada' : 'Desligada'; btn.classList.toggle('on', sala.grade_ativa); }
    }

    // ---------- Canvas / desenho ----------
    // Registrado uma única vez por entrada na sala (chamado só por
    // renderRoom). Trocar de ferramenta, ligar/desligar grade e dar zoom NÃO
    // chamam isso de novo — só mexem no canvas/DOM já existente.
    function initCanvas() {
      const grid = document.getElementById('board-grid');
      const canvas = canvasEl();
      const wrap = wrapEl();
      grid.style.backgroundImage =
        'linear-gradient(to right, #2a2d3550 1px, transparent 1px),' +
        'linear-gradient(to bottom, #2a2d3550 1px, transparent 1px)';
      grid.style.display = sala.grade_ativa ? 'block' : 'none';

      applyZoom();
      window.addEventListener('resize', function () { applyZoom(); });
      // Zoom com a rolagem do mouse (roda pra cima = zoom in), ancorado no
      // ponteiro — o ponto embaixo do mouse fica no mesmo lugar da tela.
      wrap.addEventListener('wheel', function (evt) {
        evt.preventDefault();
        setZoom(zoom + (evt.deltaY < 0 ? 0.15 : -0.15), evt.clientX, evt.clientY);
      }, { passive: false });

      canvas.classList.toggle('erase-mode', tool === 'apagar');
      canvas.classList.toggle('pan-mode', tool === 'mover');
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
    }

    // ---------- Zoom ----------
    // O quadro (grade + traços) escala junto, sempre pelo MESMO fator —
    // ambos são filhos de #board-inner e dimensionados a partir do mesmo
    // zoom, então nunca dessincronizam. anchorClientX/Y (opcionais, em
    // coordenadas de tela) é o ponto que deve continuar no mesmo lugar da
    // tela depois do zoom mudar — sem isso, o conteúdo "pula" porque só o
    // canto superior esquerdo do quadro fica fixo.
    function setZoom(z, anchorClientX, anchorClientY) {
      const wrap = wrapEl();
      const inner = document.getElementById('board-inner');
      const novoZoom = Math.max(0.5, Math.min(3, Math.round(z * 100) / 100));
      if (!wrap || !inner) { zoom = novoZoom; applyZoom(); return; }

      const rect = wrap.getBoundingClientRect();
      const ancoraX = anchorClientX != null ? anchorClientX - rect.left : wrap.clientWidth / 2;
      const ancoraY = anchorClientY != null ? anchorClientY - rect.top : wrap.clientHeight / 2;
      const larguraAntes = inner.clientWidth || 1, alturaAntes = inner.clientHeight || 1;
      const fracX = (wrap.scrollLeft + ancoraX) / larguraAntes;
      const fracY = (wrap.scrollTop + ancoraY) / alturaAntes;

      zoom = novoZoom;
      applyZoom();

      wrap.scrollLeft = fracX * inner.clientWidth - ancoraX;
      wrap.scrollTop = fracY * inner.clientHeight - ancoraY;
    }

    function applyZoom() {
      const wrap = wrapEl();
      const inner = document.getElementById('board-inner');
      if (!wrap || !inner) return;
      // wrap.clientWidth/Height é o tamanho VISÍVEL do contêiner com scroll —
      // não muda com o zoom, então serve de base estável pra calcular o
      // tamanho do conteúdo em qualquer nível de zoom. #board-inner encolhe
      // de verdade abaixo de 100% (sem clamp): isso é o que garante que a
      // grade e os traços sempre escalem exatamente juntos, no mesmo fator.
      inner.style.width = Math.round(wrap.clientWidth * zoom) + 'px';
      inner.style.height = Math.round(wrap.clientHeight * zoom) + 'px';
      const grid = document.getElementById('board-grid');
      if (grid) {
        const g = Math.max(4, Math.round((sala.grade_tamanho || 50) * zoom));
        grid.style.backgroundSize = g + 'px ' + g + 'px';
      }
      const canvas = canvasEl();
      if (canvas) {
        canvas.width = inner.clientWidth;
        canvas.height = inner.clientHeight;
        redrawCanvas();
      }
      const label = document.getElementById('zoom-label');
      if (label) label.textContent = Math.round(zoom * 100) + '%';
    }

    function canvasEl() { return document.getElementById('board-canvas'); }
    function wrapEl() { return document.getElementById('board-wrap'); }

    function relPoint(evt) {
      const c = canvasEl();
      const r = c.getBoundingClientRect();
      return { x: (evt.clientX - r.left) / r.width, y: (evt.clientY - r.top) / r.height };
    }

    function onPointerDown(evt) {
      if (tool === 'mover') {
        panning = true;
        panStart = { x: evt.clientX, y: evt.clientY, left: wrapEl().scrollLeft, top: wrapEl().scrollTop };
        canvasEl().setPointerCapture(evt.pointerId);
        return;
      }
      const p = relPoint(evt);
      if (tool === 'apagar') {
        const hit = hitTest(p);
        if (hit) removeDrawingLocal(hit.id, true);
        return;
      }
      desenhando = true;
      canvasEl().setPointerCapture(evt.pointerId);
      pontosAtuais = [p];
      previewEl = { tipo: tool, pontos: [p, p], cor: corAtual, espessura: espessuraAtual };
      redrawCanvas();
    }

    function onPointerMove(evt) {
      if (tool === 'mover') {
        if (!panning) return;
        const wrap = wrapEl();
        wrap.scrollLeft = panStart.left - (evt.clientX - panStart.x);
        wrap.scrollTop = panStart.top - (evt.clientY - panStart.y);
        return;
      }
      if (!desenhando) return;
      const p = relPoint(evt);
      if (tool === 'traco') {
        pontosAtuais.push(p);
        previewEl = { tipo: 'traco', pontos: pontosAtuais, cor: corAtual, espessura: espessuraAtual };
      } else {
        previewEl = { tipo: tool, pontos: [pontosAtuais[0], p], cor: corAtual, espessura: espessuraAtual };
      }
      redrawCanvas();
    }

    function onPointerUp() {
      if (tool === 'mover') { panning = false; return; }
      if (!desenhando) return;
      desenhando = false;
      const finalEl = previewEl;
      previewEl = null;
      if (!finalEl) return;
      // Desenho otimista: entra no array local (única fonte usada por
      // redrawCanvas) na hora, antes de qualquer chamada de rede — assim o
      // traço nunca depende da nuvem pra continuar visível na tela de quem
      // desenhou, mesmo se a gravação remota for lenta ou falhar.
      finalEl.id = TT_SALA.newDrawId();
      desenhos.push(finalEl);
      redrawCanvas();
      TT_SALA.addDrawing(sala.id, finalEl).then(function (res) {
        if (!res.ok) { console.error('Desenho não sincronizou com a nuvem (ficou salvo só neste navegador por enquanto):', res); return; }
        TT_SALA.broadcastDrawAdd(channel, res.desenho);
      });
    }

    function removeDrawingLocal(id, sendRemote) {
      desenhos = desenhos.filter(function (d) { return d.id !== id; });
      redrawCanvas();
      if (sendRemote) {
        TT_SALA.removeDrawing(sala.id, id);
        TT_SALA.broadcastDrawRemove(channel, id);
      }
    }

    function doClearAll() {
      if (!confirm('Apagar tudo que está desenhado nesta sala?')) return;
      desenhos = [];
      redrawCanvas();
      TT_SALA.clearDrawings(sala.id);
      TT_SALA.broadcastDrawClear(channel);
    }

    function redrawCanvas() {
      const c = canvasEl();
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      desenhos.forEach(function (d) { drawElement(ctx, d, c.width, c.height); });
      if (previewEl) drawElement(ctx, previewEl, c.width, c.height);
    }

    function drawElement(ctx, d, w, h) {
      const pts = d.pontos.map(function (p) { return { x: p.x * w, y: p.y * h }; });
      ctx.strokeStyle = d.cor; ctx.fillStyle = d.cor;
      ctx.lineWidth = d.espessura; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (d.tipo === 'traco') {
        if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, d.espessura / 2, 0, Math.PI * 2); ctx.fill(); return; }
        ctx.beginPath();
        pts.forEach(function (p, i) { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
        ctx.stroke();
      } else if (d.tipo === 'linha') {
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.stroke();
      } else if (d.tipo === 'retangulo') {
        const x = Math.min(pts[0].x, pts[1].x), y = Math.min(pts[0].y, pts[1].y);
        ctx.strokeRect(x, y, Math.abs(pts[1].x - pts[0].x), Math.abs(pts[1].y - pts[0].y));
      } else if (d.tipo === 'circulo') {
        const r = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, r, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // Pontos (fração) que compõem o "contorno" de um elemento, pra hit-test do apagador.
    function outlinePoints(d) {
      if (d.tipo === 'traco' || d.tipo === 'linha') return d.pontos;
      if (d.tipo === 'retangulo') {
        const [a, b] = d.pontos;
        return [{ x: a.x, y: a.y }, { x: b.x, y: a.y }, { x: b.x, y: b.y }, { x: a.x, y: b.y }, { x: a.x, y: a.y }];
      }
      if (d.tipo === 'circulo') {
        const [c0, edge] = d.pontos;
        const r = Math.hypot(edge.x - c0.x, edge.y - c0.y);
        const pts = [];
        for (let i = 0; i <= 24; i++) {
          const ang = (i / 24) * Math.PI * 2;
          pts.push({ x: c0.x + r * Math.cos(ang), y: c0.y + r * Math.sin(ang) });
        }
        return pts;
      }
      return d.pontos;
    }

    function distToSegment(p, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy;
      let t = len2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2 : 0;
      t = Math.max(0, Math.min(1, t));
      const cx = a.x + t * dx, cy = a.y + t * dy;
      return Math.hypot(p.x - cx, p.y - cy);
    }

    function hitTest(p) {
      const c = canvasEl();
      const thresholdFrac = 8 / Math.max(c.width, c.height);
      let best = null, bestDist = Infinity;
      desenhos.forEach(function (d) {
        const pts = outlinePoints(d);
        for (let i = 0; i < pts.length - 1; i++) {
          const dist = distToSegment(p, pts[i], pts[i + 1]);
          if (dist < bestDist) { bestDist = dist; best = d; }
        }
        if (pts.length === 1) {
          const dist = Math.hypot(p.x - pts[0].x, p.y - pts[0].y);
          if (dist < bestDist) { bestDist = dist; best = d; }
        }
      });
      return bestDist <= thresholdFrac + (best ? best.espessura / Math.max(c.width, c.height) : 0) ? best : null;
    }

    function handleDrawAdd(d) { desenhos.push(d); redrawCanvas(); }
    function handleDrawRemove(id) { desenhos = desenhos.filter(function (d) { return d.id !== id; }); redrawCanvas(); }
    function handleDrawClear() { desenhos = []; redrawCanvas(); }

    // ---------- Anotações ----------
    function onNotesInput() {
      const val = document.getElementById('notes-area').value;
      anotacoesTexto = val;
      clearTimeout(notesTimer);
      notesTimer = setTimeout(function () {
        TT_SALA.saveNotes(sala.id, val);
        TT_SALA.broadcastNotes(channel, val);
      }, 1500);
    }
    function handleNotesBroadcast(conteudo) {
      anotacoesTexto = conteudo;
      const el = document.getElementById('notes-area');
      if (el && document.activeElement !== el) el.value = conteudo;
    }

    // ---------- Dados ----------
    function rollPresetClick(nome) { handleRollResult(TT_DICE.rollPreset(nome)); }
    function rollFormulaClick() {
      const input = document.getElementById('formula-input');
      const err = document.getElementById('formula-err');
      const r = TT_DICE.rollFormula(input.value);
      if (r.error) { err.textContent = r.error; return; }
      err.textContent = '';
      input.value = '';
      handleRollResult(r);
    }
    function handleRollResult(resultado) {
      const err = document.getElementById('formula-err');
      TT_SALA.logRoll(sala.id, meuNome, resultado).then(function (res) {
        if (!res.ok || !res.rolagem) {
          console.error('Falha ao registrar rolagem:', res);
          if (err) err.textContent = describeFail(res, 'Não deu pra registrar a rolagem. Tente de novo.');
          return;
        }
        if (err) err.textContent = '';
        rolagens.push(res.rolagem);
        renderRollLog();
        TT_SALA.broadcastRoll(channel, res.rolagem);
      });
    }
    function handleRollBroadcast(rolagem) { rolagens.push(rolagem); renderRollLog(); }

    // Ordem cronológica (mais antiga primeiro, como um chat) e auto-scroll
    // pro fim só quando a pessoa já estava vendo o fim do log — não puxa a
    // rolagem de quem está com scroll pra cima lendo o histórico.
    function renderRollLog() {
      const el = document.getElementById('roll-log');
      if (!el) return;
      const jaEstavaNoFim = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      const items = rolagens.filter(Boolean).map(function (r) {
        const detalhe = (r.resultado && r.resultado.dice) ? ' [' + r.resultado.dice.join(', ') + ']' : '';
        const hora = r.created_at ? new Date(r.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
        return '<div class="roll-item">' +
          '<div class="roll-item-head"><span class="who">' + escapeHtml(r.nome_exibicao) + '</span>' +
          (hora ? '<span class="roll-time">' + hora + '</span>' : '') + '</div>' +
          '<div class="roll-item-body"><span class="formula">' + escapeHtml(r.formula) + escapeHtml(detalhe) + '</span>' +
          '<span class="total">' + r.total + '</span></div>' +
          '</div>';
      }).join('');
      el.innerHTML = items || '<p class="hint">Nenhuma rolagem ainda.</p>';
      if (jaEstavaNoFim) el.scrollTop = el.scrollHeight;
    }

    // ---------- Participantes (Presence) ----------
    function handlePresenceSync(state) {
      participantes = {};
      Object.keys(state).forEach(function (key) {
        (state[key] || []).forEach(function (meta) {
          participantes[meta.user_id || key] = meta.nome_exibicao || '?';
        });
      });
      renderParticipants();
    }
    function renderParticipants() {
      const el = document.getElementById('participant-list');
      if (!el) return;
      const ids = Object.keys(participantes);
      if (!ids.length) { el.innerHTML = '<p class="hint">Só você por aqui.</p>'; return; }
      el.innerHTML = ids.map(function (id) {
        const isGm = id === (sala && sala.gm_id);
        return '<div class="participant"><span class="dot"></span>' + escapeHtml(participantes[id]) + (isGm ? '<span class="gm-tag">MESTRE</span>' : '') + '</div>';
      }).join('');
    }

    boot();
  </script>
</body>
</html>
