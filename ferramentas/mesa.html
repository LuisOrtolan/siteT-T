<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa Virtual — Trilhas &amp; Tesouros</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { height: 100% }
    body {
      background: #0f1014;
      color: #f5f5f7;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }
    h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; font-weight: 600 }
    input, select, textarea, button { font-family: inherit }

    #app { height: 100vh; display: flex; flex-direction: column }

    .tt-auth-fixed {
      position: fixed; top: 8px; right: 8px; z-index: 200;
      background: #181a20; border: 1px solid #2a2d35; border-radius: 9px;
      padding: 6px 8px; max-width: 220px;
    }
    .tt-auth-form { display: flex; gap: 4px }
    .tt-auth-form input {
      background: #0f1014; border: 1px solid #2a2d35; border-radius: 5px;
      padding: 4px 6px; color: #f5f5f7; font-size: 11px; width: 120px;
    }
    .tt-auth-msg { font-size: 10px; color: #8a8fa0; margin-top: 3px }
    .tt-auth-email { font-size: 11px; color: #b0b3c0; margin-right: 6px }
    .btn-secondary { background: #c7a25a15; border-color: #c7a25a40; color: #c7a25a }
    .btn-secondary:hover { background: #c7a25a25 }

    .btn {
      background: #1f2230; border: 1px solid #2a2d35; border-radius: 6px;
      color: #f5f5f7; font-size: 12px; padding: 6px 10px; cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #2a2d3e }
    .btn.gold { background: #c7a25a15; border-color: #c7a25a40; color: #c7a25a }
    .btn.gold:hover { background: #c7a25a25 }
    .btn.on { background: #c7a25a30; border-color: #c7a25a; color: #c7a25a }
    .btn.red { background: #d0606018; border-color: #d0606040; color: #d06060 }
    .btn.red:hover { background: #d0606028 }
    .btn:disabled { opacity: .4; cursor: default }

    /* ---- Landing ---- */
    .landing-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 16px; overflow-y: auto;
    }
    .landing-card { max-width: 420px; width: 100%; }
    .tt-top { text-align: center; padding: 8px 0 18px }
    .tt-top h1 { font-size: 18px; color: #c7a25a; letter-spacing: .08em; font-weight: normal }
    .tt-top p { font-size: 11px; color: #5a5f70; margin-top: 4px }
    .sec {
      background: #181a20; border: 1px solid #2a2d35; border-radius: 9px;
      padding: 14px; margin-bottom: 12px;
    }
    .sec-t { font-size: 12px; color: #c7a25a; margin-bottom: 8px; letter-spacing: .04em }
    .fi {
      width: 100%; background: #0f1014; border: 1px solid #2a2d35; border-radius: 6px;
      padding: 8px 10px; color: #f5f5f7; font-size: 13px; margin-bottom: 8px;
    }
    .fi:focus { outline: none; border-color: #c7a25a60 }
    .hint { font-size: 10px; color: #5a5f70; margin-top: 4px }
    .err { font-size: 11px; color: #d06060; margin-top: 4px }

    .room-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #1a1d24 }
    .room-item:last-child { border-bottom: none }
    .room-item-info { display: flex; flex-direction: column; min-width: 0 }
    .room-item-info b { font-size: 13px; color: #f5f5f7; font-weight: normal }
    .room-item-meta { font-size: 10px; color: #6b7080 }

    /* ---- Room layout ---- */
    /* padding-top livra o cabeçalho do badge de login (fixo, top-right) */
    .room { flex: 1; display: flex; min-height: 0; padding-top: 48px }
    .room-main { flex: 1; display: flex; flex-direction: column; min-width: 0 }
    .room-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid #1f2230; flex-wrap: wrap;
    }
    .room-header h1 { font-size: 14px; color: #c7a25a; font-weight: normal }
    .room-code { font-size: 11px; color: #6b7080 }
    .room-code b { color: #b0b3c0; letter-spacing: .1em }

    .toolbar {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-bottom: 1px solid #1f2230; flex-wrap: wrap;
    }
    .toolbar input[type=color] {
      width: 30px; height: 30px; border: 1px solid #2a2d35; border-radius: 6px;
      background: none; padding: 0; cursor: pointer;
    }
    .toolbar input[type=range] { width: 80px }
    .toolbar .lbl { font-size: 10px; color: #6b7080 }
    .shapes-dropdown { position: relative; display: inline-block }
    .shapes-menu {
      position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 50;
      display: none; flex-direction: column; gap: 2px; min-width: 150px;
      background: #181a20; border: 1px solid #2a2d35; border-radius: 8px; padding: 4px;
    }
    .shapes-menu.aberto { display: flex }
    .shapes-menu .btn { text-align: left }

    .board-wrap { flex: 1; position: relative; overflow: auto; background: #08090c }
    .board-wrap.fundo-claro { background: #ffffff }
    .board-wrap.fundo-cinza { background: #dcdce0 }
    .board-inner { position: relative }
    .board-grid { position: absolute; inset: 0; }
    .board-canvas { position: absolute; inset: 0; touch-action: none; cursor: crosshair }
    .board-canvas.erase-mode { cursor: not-allowed }
    .board-canvas.pan-mode { cursor: grab }
    .board-canvas.pan-mode:active { cursor: grabbing }
    .board-canvas.select-mode { cursor: pointer }
    .zoom-label { font-size: 11px; color: #b0b3c0; min-width: 34px; text-align: center }

    .erase-cursor {
      position: absolute; border: 1px solid #d06060; background: #d0606022;
      border-radius: 50%; pointer-events: none; display: none; z-index: 5;
      transform: translate(-50%, -50%);
    }

    .token-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4 }
    .token {
      position: absolute; pointer-events: auto; cursor: grab; text-align: center;
      transform: translate(-50%, -50%); user-select: none;
    }
    .token.dragging { cursor: grabbing; opacity: .85 }
    .token img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 2px solid #c7a25a; box-shadow: 0 2px 10px rgba(0, 0, 0, .6); display: block;
      pointer-events: none;
    }
    .token-del {
      position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%;
      background: #d06060; color: #fff; border: none; font-size: 11px; line-height: 16px;
      cursor: pointer; padding: 0;
    }
    .token-nome {
      display: block; font-size: 10px; color: #f5f5f7; text-shadow: 0 1px 3px #000;
      margin-top: 3px; white-space: nowrap;
    }

    .token-lib { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px }
    .token-lib-item { position: relative; width: 40px; height: 40px }
    .token-lib-item img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 2px solid #2a2d35; cursor: pointer; display: block;
    }
    .token-lib-item img:hover { border-color: #c7a25a }
    .token-lib-del {
      position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; border-radius: 50%;
      background: #d06060; color: #fff; border: none; font-size: 9px; line-height: 14px;
      cursor: pointer; padding: 0;
    }

    .sidebar {
      width: 320px; flex-shrink: 0; border-left: 1px solid #1f2230;
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar .sec { margin: 10px; margin-bottom: 0 }
    .sidebar .sec:last-child { margin-bottom: 10px }

    .notes-area {
      width: 100%; min-height: 220px; background: #0f1014; border: 1px solid #2a2d35;
      border-radius: 6px; padding: 8px; color: #f5f5f7; font-size: 12px; resize: vertical;
    }
    .notes-area:focus { outline: none; border-color: #c7a25a60 }
    .notes-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px }
    .notes-tabs .btn { padding: 4px 8px; font-size: 11px }

    .dice-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px }
    .dice-presets .btn { padding: 8px 4px; text-align: center }
    .formula-row { display: flex; gap: 6px }
    .formula-row input { flex: 1 }

    .roll-log { max-height: 280px; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 6px }
    .roll-item { background: #0f1014; border: 1px solid #1a1d24; border-radius: 8px; padding: 6px 8px; font-size: 11px }
    .roll-item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 2px }
    .roll-item-head .who { color: #c7a25a; font-weight: bold }
    .roll-item-head .roll-time { color: #4a4f60; font-size: 9px; flex-shrink: 0 }
    .roll-item-body { display: flex; justify-content: space-between; align-items: baseline; gap: 6px }
    .roll-item-body .formula { color: #8a8fa0; overflow-wrap: anywhere }
    .roll-item-body .total { font-weight: bold; color: #f5f5f7; font-size: 14px; flex-shrink: 0 }

    .stats-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 300;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .stats-backdrop.aberto { display: flex }
    .stats-modal {
      background: #181a20; border: 1px solid #2a2d35; border-radius: 12px;
      padding: 18px; max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto;
    }
    .stats-modal h3 {
      color: #c7a25a; font-size: 14px; font-weight: normal; margin: 0 0 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 12px }
    .stats-table th, .stats-table td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #1a1d24 }
    .stats-table th:first-child, .stats-table td:first-child { text-align: left }
    .stats-table th { color: #6b7080; font-weight: normal }

    .init-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px }
    .init-item {
      display: flex; align-items: center; gap: 8px; background: #0f1014; border: 1px solid #1a1d24;
      border-radius: 6px; padding: 6px 8px; font-size: 12px;
    }
    .init-item.on { border-color: #c7a25a; background: #c7a25a12 }
    .init-valor { color: #c7a25a; font-weight: bold; min-width: 22px; text-align: center }
    .init-nome { flex: 1; color: #f5f5f7; overflow-wrap: anywhere }
    .init-item .btn { padding: 2px 8px; font-size: 11px }
    .init-add-row { display: flex; gap: 6px }
    .init-add-row .fi { flex: 1; margin-bottom: 0 }
    .init-add-row input[type=number] { flex: none; width: 72px }

    .participant-list { display: flex; flex-direction: column; gap: 4px }
    .participant { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #b0b3c0 }
    .participant .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a8a3a; flex-shrink: 0 }
    .participant .gm-tag { font-size: 9px; color: #c7a25a; border: 1px solid #c7a25a40; border-radius: 4px; padding: 0 4px }

    @media (max-width: 760px) {
      .room { flex-direction: column }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid #1f2230; max-height: 45vh }
      .board-wrap { flex: 1 1 40vh }
    }
  </style>
</head>
<body>
  <div id="tt-auth" class="tt-auth-fixed"></div>
  <div id="tt-gate"></div>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dice.js"></script>
  <script src="../js/sala-store.js"></script>
  <script>
    // ---------- Estado ----------
    let view = 'landing';
    let sala = null;
    let meuUserId = null;
    let meuNome = '';
    let souGM = false;
    let desenhos = [];
    let rolagens = [];
    // 4 abas visíveis por todo mundo + 1 aba "gm" (só existe/carrega/aparece
    // pro mestre — ver souGM). anotacoesGM nunca é preenchida nem exibida
    // pra quem não é mestre; a proteção de verdade é a política de RLS de
    // sala_anotacoes_gm no banco, isso aqui só evita mostrar a aba na UI.
    let anotacoes = { geral: '', equipamentos: '', tesouro: '', historia: '' };
    let anotacoesGM = '';
    let abaNotas = 'geral';
    let notesTimer = null;
    let iniciativa = { combatentes: [], turnoId: null, rodada: 1 };
    let participantes = {};
    let channel = null;

    let tool = 'traco';
    let corAtual = '#c7a25a';
    let espessuraAtual = 4;
    let desenhando = false;
    let apagando = false;
    let pontosAtuais = [];
    let previewEl = null;
    let selecionados = [];          // array de ids
    let arrastandoSelecao = false;
    let arrastarOrigem = null;
    let pontosOriginaisSelecao = null; // { id: [pontos originais...] }
    let retanguloSelecao = null;    // {x0,y0,x1,y1} fração, durante o arraste do laço
    let tokens = [];
    let arrastandoToken = null;
    let meusTokensSalvos = [];
    // O quadro é um mapa grande e fixo — MUNDO_POR_TELA vezes maior que a
    // área visível quando o tamanho da célula está "natural" (zoom 1). No
    // zoom mínimo (ZOOM_MIN = 1/MUNDO_POR_TELA), esse mapa inteiro cabe
    // exatamente na tela; dar zoom vai aproximando e mostrando só uma parte
    // dele, maior. Ver applyZoom().
    const MUNDO_POR_TELA = 4;
    const ZOOM_MIN = 1 / MUNDO_POR_TELA;
    const ZOOM_MAX = 3;
    let zoom = ZOOM_MIN;
    let panning = false;
    let panStart = null;
    let minhasSalas = [];

    const app = document.getElementById('app');

    // ---------- Boot ----------
    // O acesso à Mesa Virtual exige login — nada é renderizado em #app até
    // TT_AUTH.mountAuthGate confirmar uma sessão.
    function boot() {
      if (!window.TT_AUTH) return;
      TT_AUTH.mountUserBadge('#tt-auth');
      const codigoUrl = new URLSearchParams(location.search).get('sala');
      TT_AUTH.mountAuthGate('#tt-gate', function (session) {
        meuUserId = session.user.id;
        if (view === 'landing') renderLanding(codigoUrl || '');
      });
    }

    // ---------- Landing ----------
    function renderLanding(codigoPreenchido) {
      view = 'landing';
      app.innerHTML =
        '<div class="landing-wrap"><div class="landing-card">' +
        '<div class="back-row" style="margin-bottom:4px"><a class="btn" href="../index.html">&#8592; Site</a></div>' +
        '<div class="tt-top"><h1>&#9876; MESA VIRTUAL</h1><p>Quadro colaborativo, anotações e dados — em tempo real</p></div>' +
        '<div class="sec" id="my-rooms-sec" style="display:none"><div class="sec-t">Minhas salas</div><div id="my-rooms-list"></div></div>' +
        '<div class="sec"><div class="sec-t">Criar sala</div>' +
        '<input class="fi" id="ln-nomesala" placeholder="Nome da sala (ex: Caverna do Dragão)" maxlength="60">' +
        '<input class="fi" id="ln-meunome1" placeholder="Seu nome de personagem" maxlength="40">' +
        '<button class="btn gold" style="width:100%" onclick="doCreateRoom()">Criar sala</button>' +
        '<div class="err" id="ln-err1"></div></div>' +
        '<div class="sec"><div class="sec-t">Entrar com código</div>' +
        '<input class="fi" id="ln-codigo" placeholder="Código da sala" maxlength="6" style="text-transform:uppercase" value="' + (codigoPreenchido || '') + '">' +
        '<input class="fi" id="ln-meunome2" placeholder="Seu nome de personagem" maxlength="40">' +
        '<button class="btn gold" style="width:100%" onclick="doJoinRoom()">Entrar</button>' +
        '<div class="err" id="ln-err2"></div></div>' +
        '</div></div>';
      loadMyRooms();
    }

    function loadMyRooms() {
      TT_SALA.listMyRooms().then(function (rooms) {
        minhasSalas = rooms;
        const sec = document.getElementById('my-rooms-sec');
        const list = document.getElementById('my-rooms-list');
        if (!sec || !list) return;
        if (!rooms.length) { sec.style.display = 'none'; return; }
        sec.style.display = 'block';
        list.innerHTML = rooms.map(function (r) {
          return '<div class="room-item"><div class="room-item-info"><b>' + escapeHtml(r.nome || 'Mesa sem nome') + '</b>' +
            '<span class="room-item-meta">' + r.id + (r.souGM ? ' · você é o mestre' : '') + '</span></div>' +
            '<div style="display:flex;gap:6px;flex-shrink:0">' +
            '<button class="btn gold" onclick="resumeRoom(\'' + r.id + '\')">Retomar</button>' +
            (r.souGM ? '<button class="btn red" onclick="confirmDeleteRoom(\'' + r.id + '\')">Excluir</button>' : '') +
            '</div></div>';
        }).join('');
      });
    }

    function resumeRoom(salaId) {
      const r = minhasSalas.find(function (x) { return x.id === salaId; });
      if (!r) return;
      enterRoom(salaId, r.meuNome);
    }

    function confirmDeleteRoom(salaId) {
      const r = minhasSalas.find(function (x) { return x.id === salaId; });
      const nome = r ? (r.nome || 'Mesa sem nome') : salaId;
      if (!confirm('Apagar a sala "' + nome + '" (código ' + salaId + ')?\n\nIsso apaga o quadro, as anotações e as rolagens dela pra sempre. Não dá pra desfazer.')) return;
      TT_SALA.deleteRoom(salaId).then(function (res) {
        if (!res.ok) { console.error('Falha ao apagar sala:', res); alert('Não deu pra apagar a sala. Tente de novo.'); return; }
        loadMyRooms();
      });
    }

    // Traduz o motivo de uma falha do TT_SALA numa mensagem que ajuda a
    // diagnosticar (ex: RLS negando, tabela ausente porque o schema_mesa.sql
    // não foi rodado) sem expor jargão demais.
    function describeFail(res, fallback) {
      if (res.reason === 'logged-out') return 'Sua sessão expirou. Faça login de novo.';
      if (res.reason === 'no-auth') return 'Login não configurado neste site.';
      if (res.error && res.error.message) return fallback + ' (' + res.error.message + ')';
      return fallback;
    }

    function doCreateRoom() {
      const nomeSala = document.getElementById('ln-nomesala').value.trim();
      const nome = document.getElementById('ln-meunome1').value.trim();
      const err = document.getElementById('ln-err1');
      if (!nome) { err.textContent = 'Digite seu nome de personagem.'; return; }
      err.textContent = 'Criando...';
      TT_SALA.createRoom(nomeSala, nome).then(function (res) {
        if (!res.ok) { console.error('Falha ao criar sala:', res); err.textContent = describeFail(res, 'Não deu pra criar a sala. Tente de novo.'); return; }
        enterRoom(res.sala.id, nome);
      });
    }

    function doJoinRoom() {
      const codigo = document.getElementById('ln-codigo').value.trim().toUpperCase();
      const nome = document.getElementById('ln-meunome2').value.trim();
      const err = document.getElementById('ln-err2');
      if (!codigo) { err.textContent = 'Digite o código da sala.'; return; }
      if (!nome) { err.textContent = 'Digite seu nome de personagem.'; return; }
      err.textContent = 'Entrando...';
      TT_SALA.joinRoom(codigo, nome).then(function (res) {
        if (!res.ok) {
          console.error('Falha ao entrar na sala:', res);
          err.textContent = res.reason === 'not-found' ? 'Sala não encontrada. Confira o código.' : describeFail(res, 'Não deu pra entrar. Tente de novo.');
          return;
        }
        enterRoom(codigo, nome);
      });
    }

    function enterRoom(salaId, nome) {
      meuNome = nome;
      zoom = ZOOM_MIN; // sempre começa vendo o mapa inteiro
      Promise.all([
        TT_SALA.getRoom(salaId),
        TT_SALA.listDrawings(salaId),
        TT_SALA.listRecentRolls(salaId, 100),
        TT_SALA.getNotes(salaId),
        TT_SALA.getNotesGM(salaId),
        TT_SALA.getInitiative(salaId),
        TT_SALA.listTokens(salaId),
        TT_SALA.listMyTokens()
      ]).then(function (r) {
        sala = r[0];
        desenhos = r[1];
        rolagens = r[2];
        anotacoes = r[3];
        anotacoesGM = r[4];
        abaNotas = 'geral';
        iniciativa = r[5];
        tokens = r[6];
        meusTokensSalvos = r[7];
        souGM = sala && sala.gm_id === meuUserId;
        renderRoom();
        channel = TT_SALA.connect(salaId, meuNome, {
          onDrawAdd: handleDrawAdd,
          onDrawRemove: handleDrawRemove,
          onDrawClear: handleDrawClear,
          onDrawUpdate: handleDrawUpdate,
          onRoll: handleRollBroadcast,
          onNotesUpdate: handleNotesBroadcast,
          onInitiativeUpdate: handleInitiativeBroadcast,
          onTokenAdd: handleTokenAdd,
          onTokenUpdate: handleTokenUpdate,
          onTokenRemove: handleTokenRemove,
          onPresenceSync: handlePresenceSync
        });
      });
    }

    function leaveRoom() {
      if (channel) TT_SALA.leave(channel);
      channel = null;
      sala = null; desenhos = []; rolagens = []; participantes = {}; tokens = []; meusTokensSalvos = [];
      anotacoes = { geral: '', equipamentos: '', tesouro: '', historia: '' };
      anotacoesGM = ''; abaNotas = 'geral';
      iniciativa = { combatentes: [], turnoId: null, rodada: 1 };
      selecionados = []; arrastandoSelecao = false; retanguloSelecao = null; arrastandoToken = null;
      history.replaceState(null, '', location.pathname);
      renderLanding();
    }

    // ---------- Room shell ----------
    function renderRoom() {
      view = 'room';
      const link = location.origin + location.pathname + '?sala=' + sala.id;
      app.innerHTML =
        '<div class="room">' +
          '<div class="room-main">' +
            '<div class="room-header">' +

              '<span>Dados</span><button class="btn" style="padding:2px 8px;font-size:11px" onclick="abrirEstatisticas()">Estatísticas</button></div>' +

                ['d4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd66', '3d6'].map(function (n) {

        '<div class="stats-backdrop" id="stats-backdrop" onclick="fecharEstatisticasSeFundo(event)">' +
          '<div class="stats-modal">' +
            '<h3><span>Estatísticas de rolagens</span><button class="btn" onclick="fecharEstatisticas()">&times;</button></h3>' +

      renderRollLog();
      renderParticipants();
      renderInitiative();

    }

    function toolBtn(name, label) {
      return '<button class="btn' + (tool === name ? ' on' : '') + '" data-tool="' + name + '" onclick="setTool(\'' + name + '\')">' + label + '</button>';
    }
    // "Formas" agrupa as ferramentas de forma fechada num menu suspenso só
    // pra não lotar a barra de ferramentas conforme mais formas são
    // adicionadas. SHAPE_LABELS define a ordem e o rótulo de cada uma.
    const SHAPE_LABELS = {
      retangulo: '&#9633; Retângulo',
      circulo: '&#9711; Círculo',
      triangulo: '&#9651; Triângulo',
      trapezio: 'Trapézio',
      pentagono: '&#11040; Pentágono',
      hexagono: '&#11041; Hexágono'
    };
    const SHAPE_TOOLS = Object.keys(SHAPE_LABELS);
    function formasDropdownHtml() {
      return '<div class="shapes-dropdown">' +
        '<button class="btn' + (SHAPE_TOOLS.indexOf(tool) !== -1 ? ' on' : '') + '" id="formas-btn" onclick="toggleFormasMenu(event)">&#9635; Formas &#9662;</button>' +
        '<div class="shapes-menu" id="formas-menu">' +
          SHAPE_TOOLS.map(function (id) { return toolBtn(id, SHAPE_LABELS[id]); }).join('') +
        '</div>' +
      '</div>';
    }
    function toggleFormasMenu(evt) {
      if (evt) evt.stopPropagation();
      const menu = document.getElementById('formas-menu');
      if (menu) menu.classList.toggle('aberto');
    }
    function fecharFormasMenu() {
      const menu = document.getElementById('formas-menu');
      if (menu) menu.classList.remove('aberto');
    }
    // Só troca a ferramenta ativa — não recria o canvas nem o resto do DOM
    // (recriar apagava traços que ainda não tinham sido confirmados, ver
    // onPointerUp).
    function setTool(name) {
      tool = name;
      document.querySelectorAll('.toolbar [data-tool]').forEach(function (b) {
        b.classList.toggle('on', b.dataset.tool === name);
      });
      const formasBtn = document.getElementById('formas-btn');
      if (formasBtn) formasBtn.classList.toggle('on', SHAPE_TOOLS.indexOf(name) !== -1);
      if (SHAPE_TOOLS.indexOf(name) !== -1) fecharFormasMenu();
      const c = canvasEl();
      if (c) {
        c.classList.toggle('erase-mode', tool === 'apagar');
        c.classList.toggle('pan-mode', tool === 'mover');
        c.classList.toggle('select-mode', tool === 'selecionar');
      }
      const lbl = document.getElementById('thickness-label');
      if (lbl) lbl.textContent = tool === 'apagar' ? 'Tamanho da borracha' : 'Espessura';
      const cursor = document.getElementById('erase-cursor');
      if (cursor && tool !== 'apagar') cursor.style.display = 'none';
      if (tool !== 'selecionar' && selecionados.length) { selecionados = []; redrawCanvas(); }
    }
    function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function copyLink() {
      const link = location.origin + location.pathname + '?sala=' + sala.id;
      history.replaceState(null, '', link);
      if (navigator.clipboard) navigator.clipboard.writeText(link).catch(function () {});
    }

    function toggleGrid() {
      sala.grade_ativa = !sala.grade_ativa;
      TT_SALA.updateGrid(sala.id, { ativa: sala.grade_ativa });
      const grid = document.getElementById('board-grid');
      if (grid) grid.style.display = sala.grade_ativa ? 'block' : 'none';
      const btn = document.getElementById('grid-toggle-btn');
      if (btn) { btn.textContent = sala.grade_ativa ? 'Ligada' : 'Desligada'; btn.classList.toggle('on', sala.grade_ativa); }
    }

    // ---------- Fundo do quadro ----------
    function fundoLabel(fundo) {
      if (fundo === 'claro') return 'Claro';
      if (fundo === 'cinza') return 'Cinza';
      return 'Escuro';
    }
    // A cor da grade precisa se inverter conforme o fundo — linhas claras
    // somem num fundo claro, e vice-versa.
    function aplicarFundo() {
      const wrap = wrapEl();
      const grid = document.getElementById('board-grid');
      if (!wrap || !grid) return;
      wrap.classList.remove('fundo-claro', 'fundo-cinza');
      const escuro = sala.fundo === 'claro' || sala.fundo === 'cinza';
      if (sala.fundo === 'claro') wrap.classList.add('fundo-claro');
      else if (sala.fundo === 'cinza') wrap.classList.add('fundo-cinza');
      const corLinha = escuro ? 'rgba(0,0,0,0.15)' : '#2a2d3550';
      grid.style.backgroundImage =
        'linear-gradient(to right, ' + corLinha + ' 1px, transparent 1px),' +
        'linear-gradient(to bottom, ' + corLinha + ' 1px, transparent 1px)';
    }
    function cycleFundo() {
      const ordem = ['escuro', 'claro', 'cinza'];
      const atual = ordem.indexOf(sala.fundo || 'escuro');
      sala.fundo = ordem[(atual + 1) % ordem.length];
      TT_SALA.updateGrid(sala.id, { fundo: sala.fundo });
      aplicarFundo();
      const btn = document.getElementById('fundo-toggle-btn');
      if (btn) btn.textContent = fundoLabel(sala.fundo);
    }

    // ---------- Canvas / desenho ----------
    // Registrado uma única vez por entrada na sala (chamado só por
    // renderRoom). Trocar de ferramenta, ligar/desligar grade e dar zoom NÃO
    // chamam isso de novo — só mexem no canvas/DOM já existente.
    function initCanvas() {
      const grid = document.getElementById('board-grid');
      const canvas = canvasEl();
      const wrap = wrapEl();
      aplicarFundo();
      grid.style.display = sala.grade_ativa ? 'block' : 'none';
      initTokenLayer();

      applyZoom();
      window.addEventListener('resize', function () { applyZoom(); });
      // Zoom com a rolagem do mouse (roda pra cima = zoom in), ancorado no
      // ponteiro — o ponto embaixo do mouse fica no mesmo lugar da tela.
      wrap.addEventListener('wheel', function (evt) {
        evt.preventDefault();
        setZoom(zoom + (evt.deltaY < 0 ? 0.15 : -0.15), evt.clientX, evt.clientY);
      }, { passive: false });
      wrap.addEventListener('mouseleave', function () {
        const cursor = document.getElementById('erase-cursor');
        if (cursor) cursor.style.display = 'none';
      });

      canvas.classList.toggle('erase-mode', tool === 'apagar');
      canvas.classList.toggle('pan-mode', tool === 'mover');
      canvas.classList.toggle('select-mode', tool === 'selecionar');
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
    }

    // ---------- Zoom ----------
    // O quadro (grade + traços) escala junto, sempre pelo MESMO fator —
    // ambos são filhos de #board-inner e dimensionados a partir do mesmo
    // zoom, então nunca dessincronizam. anchorClientX/Y (opcionais, em
    // coordenadas de tela) é o ponto que deve continuar no mesmo lugar da
    // tela depois do zoom mudar — sem isso, o conteúdo "pula" porque só o
    // canto superior esquerdo do quadro fica fixo.
    function setZoom(z, anchorClientX, anchorClientY) {
      const wrap = wrapEl();
      const inner = document.getElementById('board-inner');
      const novoZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(z * 100) / 100));
      if (!wrap || !inner) { zoom = novoZoom; applyZoom(); return; }

      const rect = wrap.getBoundingClientRect();
      const ancoraX = anchorClientX != null ? anchorClientX - rect.left : wrap.clientWidth / 2;
      const ancoraY = anchorClientY != null ? anchorClientY - rect.top : wrap.clientHeight / 2;
      const larguraAntes = inner.clientWidth || 1, alturaAntes = inner.clientHeight || 1;
      const fracX = (wrap.scrollLeft + ancoraX) / larguraAntes;
      const fracY = (wrap.scrollTop + ancoraY) / alturaAntes;

      zoom = novoZoom;
      applyZoom();

      wrap.scrollLeft = fracX * inner.clientWidth - ancoraX;
      wrap.scrollTop = fracY * inner.clientHeight - ancoraY;
    }

    function applyZoom() {
      const wrap = wrapEl();
      const inner = document.getElementById('board-inner');
      if (!wrap || !inner) return;
      // wrap.clientWidth/Height é o tamanho VISÍVEL do contêiner com scroll —
      // não muda com o zoom, serve de base estável. O mapa (#board-inner) é
      // MUNDO_POR_TELA vezes esse tamanho quando o zoom está "natural" (1);
      // no ZOOM_MIN ele cai exatamente pro tamanho da tela (mapa inteiro
      // visível, sem sobrar nem faltar nada), e cresce dali pra cima — nunca
      // fica menor que a tela. Grade e traços escalam pelo mesmo `zoom`,
      // então nunca dessincronizam.
      inner.style.width = Math.round((wrap.clientWidth / ZOOM_MIN) * zoom) + 'px';
      inner.style.height = Math.round((wrap.clientHeight / ZOOM_MIN) * zoom) + 'px';
      const grid = document.getElementById('board-grid');
      if (grid) {
        const g = Math.max(4, Math.round((sala.grade_tamanho || 50) * zoom));
        grid.style.backgroundSize = g + 'px ' + g + 'px';
      }
      const canvas = canvasEl();
      if (canvas) {
        canvas.width = inner.clientWidth;
        canvas.height = inner.clientHeight;
        redrawCanvas();
      }
      const label = document.getElementById('zoom-label');
      if (label) label.textContent = Math.round(zoom * 100) + '%';
      renderTokens();
    }

    function canvasEl() { return document.getElementById('board-canvas'); }
    function wrapEl() { return document.getElementById('board-wrap'); }

    function relPoint(evt) {
      const c = canvasEl();
      const r = c.getBoundingClientRect();
      return { x: (evt.clientX - r.left) / r.width, y: (evt.clientY - r.top) / r.height };
    }

    function onPointerDown(evt) {
      if (tool === 'mover') {
        panning = true;
        panStart = { x: evt.clientX, y: evt.clientY, left: wrapEl().scrollLeft, top: wrapEl().scrollTop };
        canvasEl().setPointerCapture(evt.pointerId);
        return;
      }
      if (tool === 'apagar') {
        apagando = true;
        canvasEl().setPointerCapture(evt.pointerId);
        apagarNoPonto(relPoint(evt));
        return;
      }
      if (tool === 'selecionar') {
        const p0 = relPoint(evt);
        const hit = hitTestQualquer(p0);
        if (hit) {
          // Clicar num item que já faz parte da seleção arrasta o grupo
          // inteiro; clicar num item de fora troca a seleção pra só ele.
          if (selecionados.indexOf(hit.id) === -1) selecionados = [hit.id];
          arrastandoSelecao = true;
          arrastarOrigem = p0;
          pontosOriginaisSelecao = {};
          selecionados.forEach(function (id) {
            const d = desenhos.find(function (x) { return x.id === id; });
            if (d) pontosOriginaisSelecao[id] = d.pontos.map(function (pt) { return { x: pt.x, y: pt.y }; });
          });
          canvasEl().setPointerCapture(evt.pointerId);
        } else {
          // Clicar em área vazia começa um retângulo de seleção (laço): tudo
          // que estiver dentro dele quando soltar o botão entra na seleção.
          selecionados = [];
          retanguloSelecao = { x0: p0.x, y0: p0.y, x1: p0.x, y1: p0.y };
          canvasEl().setPointerCapture(evt.pointerId);
        }
        redrawCanvas();
        return;
      }
      const p = relPoint(evt);
      desenhando = true;
      canvasEl().setPointerCapture(evt.pointerId);
      pontosAtuais = [p];
      previewEl = { tipo: tool, pontos: [p, p], cor: corAtual, espessura: espessuraAtual };
      redrawCanvas();
    }

    function onPointerMove(evt) {
      if (tool === 'mover') {
        if (!panning) return;
        const wrap = wrapEl();
        wrap.scrollLeft = panStart.left - (evt.clientX - panStart.x);
        wrap.scrollTop = panStart.top - (evt.clientY - panStart.y);
        return;
      }
      if (tool === 'apagar') {
        updateEraseCursor(evt);
        if (apagando) apagarNoPonto(relPoint(evt));
        return;
      }
      if (tool === 'selecionar') {
        const p = relPoint(evt);
        if (arrastandoSelecao) {
          const dx = p.x - arrastarOrigem.x, dy = p.y - arrastarOrigem.y;
          selecionados.forEach(function (id) {
            const d = desenhos.find(function (x) { return x.id === id; });
            const orig = pontosOriginaisSelecao[id];
            if (d && orig) d.pontos = orig.map(function (pt) { return { x: pt.x + dx, y: pt.y + dy }; });
          });
          redrawCanvas();
        } else if (retanguloSelecao) {
          retanguloSelecao.x1 = p.x;
          retanguloSelecao.y1 = p.y;
          redrawCanvas();
        }
        return;
      }
      if (!desenhando) return;
      const p = relPoint(evt);
      if (tool === 'traco') {
        pontosAtuais.push(p);
        previewEl = { tipo: 'traco', pontos: pontosAtuais, cor: corAtual, espessura: espessuraAtual };
      } else {
        previewEl = { tipo: tool, pontos: [pontosAtuais[0], p], cor: corAtual, espessura: espessuraAtual };
      }
      redrawCanvas();
    }

    function onPointerUp() {
      if (tool === 'mover') { panning = false; return; }
      if (tool === 'apagar') { apagando = false; return; }
      if (tool === 'selecionar') {
        if (arrastandoSelecao) {
          arrastandoSelecao = false;
          selecionados.forEach(function (id) {
            const d = desenhos.find(function (x) { return x.id === id; });
            if (d) {
              TT_SALA.updateDrawing(sala.id, id, d.pontos);
              TT_SALA.broadcastDrawUpdate(channel, { id: id, pontos: d.pontos });
            }
          });
        } else if (retanguloSelecao) {
          const rx0 = Math.min(retanguloSelecao.x0, retanguloSelecao.x1);
          const rx1 = Math.max(retanguloSelecao.x0, retanguloSelecao.x1);
          const ry0 = Math.min(retanguloSelecao.y0, retanguloSelecao.y1);
          const ry1 = Math.max(retanguloSelecao.y0, retanguloSelecao.y1);
          // Ignora arrastos quase nulos (clique parado) — já foi tratado
          // como "desmarcar tudo" no pointerdown.
          if (rx1 - rx0 > 0.003 || ry1 - ry0 > 0.003) {
            const ret = { x0: rx0, y0: ry0, x1: rx1, y1: ry1 };
            const cnv = canvasEl();
            selecionados = desenhos.filter(function (d) { return retangulosSeSobrepoe(bboxDoDesenho(d, cnv.width, cnv.height), ret); }).map(function (d) { return d.id; });
          }
          retanguloSelecao = null;
          redrawCanvas();
        }
        return;
      }
      if (!desenhando) return;
      desenhando = false;
      const finalEl = previewEl;
      previewEl = null;
      if (!finalEl) return;
      // Desenho otimista: entra no array local (única fonte usada por
      // redrawCanvas) na hora, antes de qualquer chamada de rede — assim o
      // traço nunca depende da nuvem pra continuar visível na tela de quem
      // desenhou, mesmo se a gravação remota for lenta ou falhar.
      finalEl.id = TT_SALA.newDrawId();
      desenhos.push(finalEl);
      redrawCanvas();
      TT_SALA.addDrawing(sala.id, finalEl).then(function (res) {
        if (!res.ok) { console.error('Desenho não sincronizou com a nuvem (ficou salvo só neste navegador por enquanto):', res); return; }
        TT_SALA.broadcastDrawAdd(channel, res.desenho);
      });
    }

    function doClearAll() {
      if (!confirm('Apagar tudo que está desenhado nesta sala?')) return;
      desenhos = [];
      redrawCanvas();
      TT_SALA.clearDrawings(sala.id);
      TT_SALA.broadcastDrawClear(channel);
    }

    function redrawCanvas() {
      const c = canvasEl();
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      desenhos.forEach(function (d) { drawElement(ctx, d, c.width, c.height); });
      if (previewEl) drawElement(ctx, previewEl, c.width, c.height);
      selecionados.forEach(function (id) {
        const sel = desenhos.find(function (d) { return d.id === id; });
        if (sel) desenharDestaqueSelecao(ctx, sel, c.width, c.height);
      });
      if (retanguloSelecao) desenharRetanguloSelecao(ctx, c.width, c.height);
    }

    // Retângulo semitransparente que acompanha o arraste do laço de seleção.
    function desenharRetanguloSelecao(ctx, w, h) {
      const x0 = Math.min(retanguloSelecao.x0, retanguloSelecao.x1) * w;
      const y0 = Math.min(retanguloSelecao.y0, retanguloSelecao.y1) * h;
      const x1 = Math.max(retanguloSelecao.x0, retanguloSelecao.x1) * w;
      const y1 = Math.max(retanguloSelecao.y0, retanguloSelecao.y1) * h;
      ctx.save();
      ctx.fillStyle = 'rgba(199,162,90,0.12)';
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      ctx.strokeStyle = '#c7a25a';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
      ctx.restore();
    }

    // Bounding box (fração) de um desenho, pra testar sobreposição com o
    // retângulo do laço de seleção.
    function bboxDoDesenho(d, w, h) {
      const pts = outlinePoints(d, w, h);
      const xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
      return { x0: Math.min.apply(null, xs), y0: Math.min.apply(null, ys), x1: Math.max.apply(null, xs), y1: Math.max.apply(null, ys) };
    }
    function retangulosSeSobrepoe(a, b) {
      return a.x0 <= b.x1 && a.x1 >= b.x0 && a.y0 <= b.y1 && a.y1 >= b.y0;
    }

    // Apaga tudo que estiver selecionado (tecla Delete/Backspace, ver o
    // listener de teclado perto do boot() no fim do arquivo).
    function apagarSelecionados() {
      const ids = selecionados.slice();
      if (!ids.length) return;
      desenhos = desenhos.filter(function (d) { return ids.indexOf(d.id) === -1; });
      selecionados = [];
      redrawCanvas();
      ids.forEach(function (id) {
        TT_SALA.removeDrawing(sala.id, id);
        TT_SALA.broadcastDrawRemove(channel, id);
      });
    }

    // Retângulo tracejado ao redor do desenho selecionado, com uma margem
    // (padding) pra ficar visível mesmo em traços finos.
    function desenharDestaqueSelecao(ctx, d, w, h) {
      const pts = outlinePoints(d, w, h).map(function (p) { return { x: p.x * w, y: p.y * h }; });
      const xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
      const pad = 10;
      const x = Math.min.apply(null, xs) - pad, y = Math.min.apply(null, ys) - pad;
      const largura = Math.max.apply(null, xs) - Math.min.apply(null, xs) + pad * 2;
      const altura = Math.max.apply(null, ys) - Math.min.apply(null, ys) + pad * 2;
      ctx.save();
      ctx.strokeStyle = '#c7a25a';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(x, y, largura, altura);
      ctx.restore();
    }

    function drawElement(ctx, d, w, h) {
      const pts = d.pontos.map(function (p) { return { x: p.x * w, y: p.y * h }; });
      ctx.strokeStyle = d.cor; ctx.fillStyle = d.cor;
      ctx.lineWidth = d.espessura; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      if (d.tipo === 'traco') {
        if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, d.espessura / 2, 0, Math.PI * 2); ctx.fill(); return; }
        if (pts.length === 2) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.stroke(); return; }
        // Suaviza o traço livre com curvas quadráticas entre os pontos médios
        // em vez de segmentos retos — é o que dá a sensação "fluida" de
        // desenho à mão, sem mudar como os pontos são guardados/apagados.
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length - 1; i++) {
          const mx = (pts[i].x + pts[i + 1].x) / 2;
          const my = (pts[i].y + pts[i + 1].y) / 2;
          ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
        }
        ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
        ctx.stroke();
      } else if (d.tipo === 'linha') {
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.stroke();
      } else if (d.tipo === 'retangulo') {
        const x = Math.min(pts[0].x, pts[1].x), y = Math.min(pts[0].y, pts[1].y);
        ctx.strokeRect(x, y, Math.abs(pts[1].x - pts[0].x), Math.abs(pts[1].y - pts[0].y));
      } else if (d.tipo === 'trapezio') {
        const [x0, x1] = [Math.min(pts[0].x, pts[1].x), Math.max(pts[0].x, pts[1].x)];
        const [y0, y1] = [Math.min(pts[0].y, pts[1].y), Math.max(pts[0].y, pts[1].y)];
        const inset = (x1 - x0) * TRAPEZIO_INSET;
        ctx.beginPath();
        ctx.moveTo(x0 + inset, y0); ctx.lineTo(x1 - inset, y0); ctx.lineTo(x1, y1); ctx.lineTo(x0, y1);
        ctx.closePath(); ctx.stroke();
      } else if (d.tipo === 'circulo') {
        // Único caso desenhado com ctx.arc (curva de verdade) em vez de um
        // polígono de poucos lados — as outras formas "de centro+raio"
        // (triângulo/pentágono/hexágono) usam POLIGONO_LADOS logo abaixo.
        const r = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, r, 0, Math.PI * 2); ctx.stroke();
      } else if (POLIGONO_LADOS[d.tipo]) {
        const n = POLIGONO_LADOS[d.tipo];
        const raio = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const anguloBase = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const ang = anguloBase + (i / n) * Math.PI * 2;
          const x = pts[0].x + raio * Math.cos(ang), y = pts[0].y + raio * Math.sin(ang);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.stroke();
      }
    }

    // Formas "de centro+raio" (o 2º ponto define o raio e, por causa do
    // atan2, também o ângulo de partida — arrastar pra um lado gira a forma
    // pra esse lado) aproximadas por um polígono regular de N lados.
    // circulo usa N alto o bastante (24) que ninguém percebe as quinas; as
    // outras (triângulo/pentágono/hexágono) usam o N de verdade da forma.
    const POLIGONO_LADOS = { circulo: 24, triangulo: 3, pentagono: 5, hexagono: 6 };
    // Trapézio é "de caixa" como o retângulo (2 pontos = cantos opostos),
    // só que a borda de cima é mais estreita que a de baixo — INSET é a
    // fração de cada lado que "recua" na borda de cima.
    const TRAPEZIO_INSET = 0.2;

    // w/h (dimensões reais do canvas em pixels) importam pras formas de
    // centro+raio: o quadro quase nunca é quadrado, então um raio calculado
    // a partir de 2 pontos em fração precisa ser convertido pra pixels
    // antes de aplicar seno/cosseno — senão a forma sai "esticada",
    // gerando cliques/apagões fora do lugar perto do topo/base dela. w/h
    // têm um fallback de 1 só pra não quebrar se algum chamador esquecer
    // de passar (fica com a distorção de antes, mas não trava).
    function pontosPoligonoRegular(c0, edge, n, w, h) {
      const ww = w || 1, hh = h || 1;
      const dx = (edge.x - c0.x) * ww, dy = (edge.y - c0.y) * hh;
      const raioPx = Math.hypot(dx, dy);
      const anguloBase = Math.atan2(dy, dx);
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const ang = anguloBase + (i / n) * Math.PI * 2;
        pts.push({ x: c0.x + (raioPx * Math.cos(ang)) / ww, y: c0.y + (raioPx * Math.sin(ang)) / hh });
      }
      return pts;
    }

    // Pontos (fração) que compõem o "contorno" de um elemento, pra hit-test,
    // destaque de seleção e apagador.
    function outlinePoints(d, w, h) {
      if (d.tipo === 'traco' || d.tipo === 'linha') return d.pontos;
      if (d.tipo === 'retangulo') {
        const [a, b] = d.pontos;
        return [{ x: a.x, y: a.y }, { x: b.x, y: a.y }, { x: b.x, y: b.y }, { x: a.x, y: b.y }, { x: a.x, y: a.y }];
      }
      if (d.tipo === 'trapezio') {
        const [a, b] = d.pontos;
        const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
        const y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
        const inset = (x1 - x0) * TRAPEZIO_INSET;
        return [{ x: x0 + inset, y: y0 }, { x: x1 - inset, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }, { x: x0 + inset, y: y0 }];
      }
      if (POLIGONO_LADOS[d.tipo]) return pontosPoligonoRegular(d.pontos[0], d.pontos[1], POLIGONO_LADOS[d.tipo], w, h);
      return d.pontos;
    }

    function distToSegment(p, a, b) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy;
      let t = len2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2 : 0;
      t = Math.max(0, Math.min(1, t));
      const cx = a.x + t * dx, cy = a.y + t * dy;
      return Math.hypot(p.x - cx, p.y - cy);
    }

    // Qualquer tipo de desenho (traço/linha/retângulo/círculo) — usado pela
    // ferramenta "Selecionar", que precisa poder pegar qualquer coisa no
    // quadro, diferente da borracha (que trata traço/linha à parte).
    function hitTestQualquer(p) {
      const c = canvasEl();
      const thresholdFrac = 10 / Math.max(c.width, c.height);
      let best = null, bestDist = Infinity;
      desenhos.forEach(function (d) {
        const pts = outlinePoints(d, c.width, c.height);
        for (let i = 0; i < pts.length - 1; i++) {
          const dist = distToSegment(p, pts[i], pts[i + 1]);
          if (dist < bestDist) { bestDist = dist; best = d; }
        }
        if (pts.length === 1) {
          const dist = Math.hypot(p.x - pts[0].x, p.y - pts[0].y);
          if (dist < bestDist) { bestDist = dist; best = d; }
        }
      });
      return bestDist <= thresholdFrac + (best ? best.espessura / Math.max(c.width, c.height) : 0) ? best : null;
    }

    // Raio da borracha em pixels de tela — um pouco maior que a espessura
    // do traço, pra ser fácil de acertar (igual no Owlbear: a borracha é
    // sempre mais "gorda" que a caneta do mesmo tamanho).
    function borrachaRaioPx() { return Math.max(espessuraAtual, 8) * 1.6; }

    function updateEraseCursor(evt) {
      const cursor = document.getElementById('erase-cursor');
      if (!cursor) return;
      const wrap = wrapEl();
      const rect = wrap.getBoundingClientRect();
      const raio = borrachaRaioPx();
      cursor.style.width = cursor.style.height = (raio * 2) + 'px';
      cursor.style.left = (evt.clientX - rect.left + wrap.scrollLeft) + 'px';
      cursor.style.top = (evt.clientY - rect.top + wrap.scrollTop) + 'px';
      cursor.style.display = 'block';
    }

    // Subdivide em pontos intermediários antes de aplicar a lógica de
    // apagamento por vértice usada no traço livre — sem isso, formas com
    // poucos pontos de controle (linha: só início/fim; retângulo/círculo:
    // só o contorno original de outlinePoints) só poderiam ser cortadas
    // bem em cima de um desses pontos, não em qualquer lugar da borda.
    function amostrarSegmento(a, b, passos) {
      const out = [];
      for (let i = 0; i <= passos; i++) {
        const t = i / passos;
        out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
      }
      return out;
    }
    function densificarParaApagar(d, w, h) {
      if (d.tipo === 'traco') return d.pontos;
      if (d.tipo === 'linha') return amostrarSegmento(d.pontos[0], d.pontos[1], 40);
      // Qualquer forma fechada: outlinePoints já devolve um contorno
      // fechado (o último ponto repete o primeiro) — subdivide cada
      // segmento dele. O círculo já tem 24 segmentos curtos (poucos passos
      // bastam); as demais têm poucos lados retos e longos (mais passos
      // pra poder cortar em qualquer ponto da borda, não só nas quinas).
      const contorno = outlinePoints(d, w, h);
      const passos = d.tipo === 'circulo' ? 4 : 20;
      const out = [];
      for (let i = 0; i < contorno.length - 1; i++) {
        out.push.apply(out, amostrarSegmento(contorno[i], contorno[i + 1], passos));
      }
      return out;
    }

    // Quebra pts/fora em pedaços contíguos de pontos mantidos (>=2 pontos).
    // Pra formas FECHADAS (retângulo/círculo), o array de pontos sempre
    // começa e termina no mesmo lugar (é um laço) — sem girar o array pra
    // começar logo depois de um trecho apagado, um corte único no meio do
    // contorno "quebraria" o laço em 2 pedaços que só parecem 1 (as pontas
    // ficam vizinhas), gerando um traço a mais à toa. Girando, o corte
    // sempre cai exatamente na emenda do array, e sobra 1 pedaço só.
    function pedacosMantidos(pts, fora, fechado) {
      let ptsScan = pts, foraScan = fora;
      if (fechado) {
        const idxApagado = fora.indexOf(false);
        const n = pts.length;
        ptsScan = []; foraScan = [];
        for (let i = 0; i < n; i++) {
          const idx = (idxApagado + 1 + i) % n;
          ptsScan.push(pts[idx]);
          foraScan.push(fora[idx]);
        }
      }
      const pedacos = [];
      let atual = [];
      for (let i = 0; i <= ptsScan.length; i++) {
        if (i < ptsScan.length && foraScan[i]) { atual.push(ptsScan[i]); continue; }
        if (atual.length >= 2) pedacos.push(atual);
        atual = [];
      }
      return pedacos;
    }

    // Apaga só a parte de qualquer desenho (traço, linha ou qualquer forma
    // fechada — retângulo, trapézio, círculo, triângulo, pentágono,
    // hexágono) que cai dentro do raio da borracha em `p`, cortando em
    // pedaços separados em vez de remover o desenho inteiro. Uma forma
    // fechada vira um ou mais traços abertos depois de cortada — com um
    // pedaço faltando ela deixa de ser um "retângulo"/"círculo"/etc., é só
    // o contorno que sobrou.
    function eraseAt(p) {
      const c = canvasEl();
      const raioPx = borrachaRaioPx();
      const mantidos = [];
      const removidosIds = [];
      const adicionados = [];

      desenhos.forEach(function (d) {
        const pts = densificarParaApagar(d, c.width, c.height);
        // Distância em pixels de verdade (escalando x e y pelas dimensões
        // reais do canvas antes do hypot) — o quadro quase nunca é
        // quadrado, então comparar direto as frações x/y sem escalar
        // distorce a distância (fica "elíptica" em vez de circular),
        // mais perceptível justamente ao apagar um círculo.
        const fora = pts.map(function (pt) {
          return Math.hypot((pt.x - p.x) * c.width, (pt.y - p.y) * c.height) > raioPx;
        });
        if (fora.every(Boolean)) { mantidos.push(d); return; }

        removidosIds.push(d.id);
        const fechado = d.tipo === 'retangulo' || d.tipo === 'trapezio' || !!POLIGONO_LADOS[d.tipo];
        pedacosMantidos(pts, fora, fechado).forEach(function (atual) {
          const novo = { id: TT_SALA.newDrawId(), tipo: 'traco', pontos: atual, cor: d.cor, espessura: d.espessura };
          mantidos.push(novo); adicionados.push(novo);
        });
      });

      if (!removidosIds.length) return;
      desenhos = mantidos;
      redrawCanvas();
      removidosIds.forEach(function (id) {
        TT_SALA.removeDrawing(sala.id, id);
        TT_SALA.broadcastDrawRemove(channel, id);
      });
      adicionados.forEach(function (novo) {
        TT_SALA.addDrawing(sala.id, novo).then(function (res) {
          if (res.ok) TT_SALA.broadcastDrawAdd(channel, res.desenho);
        });
      });
    }

    function apagarNoPonto(p) {
      eraseAt(p);
    }

    function handleDrawAdd(d) { desenhos.push(d); redrawCanvas(); }
    function handleDrawRemove(id) { desenhos = desenhos.filter(function (d) { return d.id !== id; }); redrawCanvas(); }
    function handleDrawClear() { desenhos = []; redrawCanvas(); }
    function handleDrawUpdate(payload) {
      const d = desenhos.find(function (x) { return x.id === payload.id; });
      if (d) { d.pontos = payload.pontos; redrawCanvas(); }
    }

    // ---------- Tokens ----------
    // Tokens são <img> posicionadas por cima do canvas (não desenhadas nele)
    // — arrastáveis por conta própria, independente da ferramenta ativa no
    // quadro (igual a maioria dos VTTs: o token é uma camada à parte).
    function initTokenLayer() {
      const layer = document.getElementById('board-tokens');
      if (!layer) return;
      layer.addEventListener('pointerdown', function (evt) {
        if (evt.target.classList.contains('token-del')) return;
        const el = evt.target.closest('.token');
        if (!el) return;
        const id = el.dataset.id;
        const tok = tokens.find(function (t) { return t.id === id; });
        if (!tok) return;
        arrastandoToken = { id: id, startX: evt.clientX, startY: evt.clientY, origX: tok.x, origY: tok.y };
        layer.setPointerCapture(evt.pointerId);
        el.classList.add('dragging');
      });
      layer.addEventListener('pointermove', function (evt) {
        if (!arrastandoToken) return;
        const inner = document.getElementById('board-inner');
        const tok = tokens.find(function (t) { return t.id === arrastandoToken.id; });
        if (!tok || !inner) return;
        tok.x = arrastandoToken.origX + (evt.clientX - arrastandoToken.startX) / inner.clientWidth;
        tok.y = arrastandoToken.origY + (evt.clientY - arrastandoToken.startY) / inner.clientHeight;
        posicionarTokenEl(tok);
      });
      layer.addEventListener('pointerup', function (evt) {
        if (!arrastandoToken) return;
        const id = arrastandoToken.id;
        layer.releasePointerCapture(evt.pointerId);
        arrastandoToken = null;
        const el = layer.querySelector('.token[data-id="' + id + '"]');
        if (el) el.classList.remove('dragging');
        const tok = tokens.find(function (t) { return t.id === id; });
        if (tok) {
          TT_SALA.updateToken(sala.id, id, { x: tok.x, y: tok.y });
          TT_SALA.broadcastTokenUpdate(channel, { id: id, x: tok.x, y: tok.y });
        }
      });
    }

    function renderTokens() {
      const layer = document.getElementById('board-tokens');
      const inner = document.getElementById('board-inner');
      if (!layer || !inner) return;
      layer.innerHTML = tokens.map(function (t) {
        return '<div class="token" data-id="' + t.id + '">' +
          '<img src="' + t.imagem_url + '" alt="' + escapeHtml(t.nome || '') + '" draggable="false">' +
          '<button class="token-del" title="Remover token" onclick="removerToken(\'' + t.id + '\')">&times;</button>' +
          (t.nome ? '<span class="token-nome">' + escapeHtml(t.nome) + '</span>' : '') +
          '</div>';
      }).join('');
      tokens.forEach(posicionarTokenEl);
    }

    function posicionarTokenEl(t) {
      const inner = document.getElementById('board-inner');
      const el = document.querySelector('.token[data-id="' + t.id + '"]');
      if (!inner || !el) return;
      // Tamanho mínimo pra continuar clicável/arrastável em zoom baixo — sem
      // isso, num zoom bem afastado o token encolhe tanto que o botão de
      // remover (que fica no cantinho dele) acaba cobrindo o token inteiro.
      const tamanhoPx = Math.max((t.tamanho || 56) * zoom, 28);
      el.style.left = (t.x * inner.clientWidth) + 'px';
      el.style.top = (t.y * inner.clientHeight) + 'px';
      el.style.width = tamanhoPx + 'px';
      el.style.height = tamanhoPx + 'px';
    }

    function onTokenFileChosen(evt) {
      const file = evt.target.files && evt.target.files[0];
      evt.target.value = ''; // permite escolher o mesmo arquivo de novo depois
      if (!file) return;
      const err = document.getElementById('token-err');
      if (file.size > 5 * 1024 * 1024) { if (err) err.textContent = 'Imagem muito grande (máx. 5MB).'; return; }
      const nome = (document.getElementById('token-nome-input').value || '').trim();
      if (err) err.textContent = 'Enviando...';
      TT_SALA.uploadTokenImage(sala.id, file).then(function (res) {
        if (!res.ok) { if (err) err.textContent = describeFail(res, 'Não deu pra enviar a imagem.'); return; }
        const novo = { id: TT_SALA.newTokenId(), nome: nome, imagem_url: res.url, x: 0.5, y: 0.5, tamanho: 56 };
        tokens.push(novo);
        renderTokens();
        if (err) err.textContent = '';
        document.getElementById('token-nome-input').value = '';
        TT_SALA.addToken(sala.id, novo).then(function (res2) {
          if (res2.ok) TT_SALA.broadcastTokenAdd(channel, novo);
        });
        // Salva na biblioteca pessoal pra reusar depois sem subir de novo.
        TT_SALA.saveMyToken(nome, res.url).then(function (res3) {
          if (res3.ok) { meusTokensSalvos.unshift(res3.token); renderTokenLibrary(); }
        });
      });
    }

    function removerToken(id) {
      tokens = tokens.filter(function (t) { return t.id !== id; });
      renderTokens();
      TT_SALA.removeToken(sala.id, id);
      TT_SALA.broadcastTokenRemove(channel, id);
    }

    // ---------- Biblioteca pessoal de tokens ----------
    function renderTokenLibrary() {
      const el = document.getElementById('token-library');
      if (!el) return;
      el.innerHTML = meusTokensSalvos.map(function (t) {
        return '<div class="token-lib-item" title="' + escapeHtml(t.nome || 'Token') + ' (clique pra usar)">' +
          '<img src="' + t.imagem_url + '" alt="' + escapeHtml(t.nome || '') + '" onclick="usarTokenSalvo(\'' + t.id + '\')">' +
          '<button class="token-lib-del" title="Remover da biblioteca" onclick="apagarTokenSalvo(\'' + t.id + '\')">&times;</button>' +
          '</div>';
      }).join('');
    }
    // Cria um novo token na mesa reaproveitando uma imagem já salva — sem
    // upload novo.
    function usarTokenSalvo(id) {
      const salvo = meusTokensSalvos.find(function (t) { return t.id === id; });
      if (!salvo) return;
      const novo = { id: TT_SALA.newTokenId(), nome: salvo.nome, imagem_url: salvo.imagem_url, x: 0.5, y: 0.5, tamanho: 56 };
      tokens.push(novo);
      renderTokens();
      TT_SALA.addToken(sala.id, novo).then(function (res) {
        if (res.ok) TT_SALA.broadcastTokenAdd(channel, novo);
      });
    }
    // Só remove da biblioteca (lista de reuso) — não mexe em tokens já
    // colocados em alguma mesa.
    function apagarTokenSalvo(id) {
      meusTokensSalvos = meusTokensSalvos.filter(function (t) { return t.id !== id; });
      renderTokenLibrary();
      TT_SALA.deleteMyToken(id);
    }

    function handleTokenAdd(t) { tokens.push(t); renderTokens(); }
    function handleTokenRemove(id) { tokens = tokens.filter(function (t) { return t.id !== id; }); renderTokens(); }
    function handleTokenUpdate(payload) {
      const t = tokens.find(function (x) { return x.id === payload.id; });
      if (t) { t.x = payload.x; t.y = payload.y; posicionarTokenEl(t); }
    }

    // ---------- Anotações ----------
    // 4 abas (geral/equipamentos/tesouro/história) ficam numa única linha
    // da tabela sala_anotacoes (uma coluna por aba) e são visíveis e
    // editáveis por todo mundo, sincronizadas por broadcast igual antes. A
    // aba "gm" é outra tabela (sala_anotacoes_gm) com política de RLS que só
    // deixa o mestre ler/escrever — e por isso nunca é enviada pelo canal de
    // broadcast da sala (esse canal não tem controle de acesso: qualquer
    // participante recebe tudo que é transmitido nele, RLS ou não, então
    // transmitir o conteúdo do mestre ali vazaria pros jogadores mesmo com o
    // banco protegido). Sincroniza só por salvar/recarregar.
    const NOTES_TABS = [
      { id: 'geral', label: 'Geral' },
      { id: 'equipamentos', label: 'Equipamentos' },
      { id: 'tesouro', label: 'Tesouro' },
      { id: 'historia', label: 'História' }
    ];
    function notesTabBtn(aba, label, extraClass) {
      return '<button class="btn' + (extraClass || '') + (abaNotas === aba ? ' on' : '') + '" data-aba="' + aba + '" onclick="trocarAbaNotas(\'' + aba + '\')">' + label + '</button>';
    }
    function notasConteudoAtual() { return abaNotas === 'gm' ? anotacoesGM : (anotacoes[abaNotas] || ''); }
    function notasPlaceholder(aba) {
      return aba === 'gm' ? 'Anotações só suas — não aparecem pros jogadores...' : 'Anotações da aventura, visíveis e editáveis por todo mundo...';
    }
    function trocarAbaNotas(aba) {
      abaNotas = aba;
      document.querySelectorAll('.notes-tabs [data-aba]').forEach(function (b) {
        b.classList.toggle('on', b.dataset.aba === aba);
      });
      const el = document.getElementById('notes-area');
      if (el) { el.value = notasConteudoAtual(); el.placeholder = notasPlaceholder(aba); }
    }
    function onNotesInput() {
      const aba = abaNotas;
      const val = document.getElementById('notes-area').value;
      if (aba === 'gm') anotacoesGM = val; else anotacoes[aba] = val;
      clearTimeout(notesTimer);
      notesTimer = setTimeout(function () {
        if (aba === 'gm') {
          TT_SALA.saveNotesGM(sala.id, val);
        } else {
          TT_SALA.saveNotes(sala.id, aba, val);
          TT_SALA.broadcastNotes(channel, aba, val);
        }
      }, 1500);
    }
    function handleNotesBroadcast(payload) {
      anotacoes[payload.aba] = payload.conteudo;
      const el = document.getElementById('notes-area');
      if (el && abaNotas === payload.aba && document.activeElement !== el) el.value = payload.conteudo;
    }

    // ---------- Iniciativa ----------
    // Estado: { combatentes: [{id, nome, valor}], turnoId, rodada }. turnoId
    // (em vez de um índice) sobrevive a adições/remoções sem precisar
    // recalcular posição — só o combatente daquele id importa.
    function newInitId() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function iniciativaOrdenada() {
      return iniciativa.combatentes.slice().sort(function (a, b) { return b.valor - a.valor; });
    }
    function saveAndBroadcastInitiative() {
      TT_SALA.saveInitiative(sala.id, iniciativa);
      TT_SALA.broadcastInitiative(channel, iniciativa);
    }
    function addCombatente() {
      const nomeInput = document.getElementById('init-nome');
      const valorInput = document.getElementById('init-valor');
      const nome = nomeInput.value.trim();
      const valor = parseInt(valorInput.value, 10);
      if (!nome || isNaN(valor)) return;
      // turnoId só é definido quando "Próximo" é clicado pela primeira vez
      // (ver proximoTurno) — se fosse fixado aqui, no primeiro combatente
      // adicionado, ficaria "preso" nele mesmo depois que alguém com
      // iniciativa maior entrasse na lista.
      iniciativa.combatentes.push({ id: newInitId(), nome: nome, valor: valor });
      nomeInput.value = ''; valorInput.value = '';
      nomeInput.focus();
      renderInitiative();
      saveAndBroadcastInitiative();
    }
    function removeCombatente(id) {
      iniciativa.combatentes = iniciativa.combatentes.filter(function (c) { return c.id !== id; });
      if (iniciativa.turnoId === id) {
        const ord = iniciativaOrdenada();
        iniciativa.turnoId = ord.length ? ord[0].id : null;
      }
      renderInitiative();
      saveAndBroadcastInitiative();
    }
    function proximoTurno() {
      const ord = iniciativaOrdenada();
      if (!ord.length) return;
      const idxAtual = ord.findIndex(function (c) { return c.id === iniciativa.turnoId; });
      if (idxAtual === -1) {
        iniciativa.turnoId = ord[0].id;
      } else {
        const proximo = (idxAtual + 1) % ord.length;
        if (proximo === 0) iniciativa.rodada = (iniciativa.rodada || 1) + 1;
        iniciativa.turnoId = ord[proximo].id;
      }
      renderInitiative();
      saveAndBroadcastInitiative();
    }
    function limparIniciativa() {
      if (!confirm('Limpar a lista de iniciativa?')) return;
      iniciativa = { combatentes: [], turnoId: null, rodada: 1 };
      renderInitiative();
      saveAndBroadcastInitiative();
    }
    function handleInitiativeBroadcast(estado) {
      iniciativa = estado;
      renderInitiative();
    }
    function renderInitiative() {
      const el = document.getElementById('initiative-list');
      if (!el) return;
      const roundEl = document.getElementById('initiative-round');
      if (roundEl) roundEl.textContent = 'Rodada ' + (iniciativa.rodada || 1);
      const ord = iniciativaOrdenada();
      if (!ord.length) { el.innerHTML = '<p class="hint">Nenhum combatente ainda.</p>'; return; }
      el.innerHTML = ord.map(function (c) {
        return '<div class="init-item' + (c.id === iniciativa.turnoId ? ' on' : '') + '">' +
          '<span class="init-valor">' + c.valor + '</span>' +
          '<span class="init-nome">' + escapeHtml(c.nome) + '</span>' +
          '<button class="btn red" onclick="removeCombatente(\'' + c.id + '\')">&times;</button>' +
          '</div>';
      }).join('');
    }

    // ---------- Dados ----------
    function rollPresetClick(nome) { handleRollResult(TT_DICE.rollPreset(nome)); }
    function rollFormulaClick() {
      const input = document.getElementById('formula-input');
      const err = document.getElementById('formula-err');
      const r = TT_DICE.rollFormula(input.value);
      if (r.error) { err.textContent = r.error; return; }
      err.textContent = '';
      input.value = '';
      handleRollResult(r);
    }
    function handleRollResult(resultado) {
      const err = document.getElementById('formula-err');
      TT_SALA.logRoll(sala.id, meuNome, resultado).then(function (res) {
        if (!res.ok || !res.rolagem) {
          console.error('Falha ao registrar rolagem:', res);
          if (err) err.textContent = describeFail(res, 'Não deu pra registrar a rolagem. Tente de novo.');
          return;
        }
        if (err) err.textContent = '';
        rolagens.push(res.rolagem);
        renderRollLog();
        TT_SALA.broadcastRoll(channel, res.rolagem);
      });
    }
    function handleRollBroadcast(rolagem) { rolagens.push(rolagem); renderRollLog(); }

    // Ordem cronológica (mais antiga primeiro, como um chat) e auto-scroll
    // pro fim só quando a pessoa já estava vendo o fim do log — não puxa a
    // rolagem de quem está com scroll pra cima lendo o histórico.
    function renderRollLog() {
      const el = document.getElementById('roll-log');
      if (!el) return;
      const jaEstavaNoFim = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      const items = rolagens.filter(Boolean).map(function (r) {
        const detalhe = (r.resultado && r.resultado.dice) ? ' [' + r.resultado.dice.join(', ') + ']' : '';
        const hora = r.created_at ? new Date(r.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
        return '<div class="roll-item">' +
          '<div class="roll-item-head"><span class="who">' + escapeHtml(r.nome_exibicao) + '</span>' +
          (hora ? '<span class="roll-time">' + hora + '</span>' : '') + '</div>' +
          '<div class="roll-item-body"><span class="formula">' + escapeHtml(r.formula) + escapeHtml(detalhe) + '</span>' +
          '<span class="total">' + r.total + '</span></div>' +
          '</div>';
      }).join('');
      el.innerHTML = items || '<p class="hint">Nenhuma rolagem ainda.</p>';
      if (jaEstavaNoFim) el.scrollTop = el.scrollHeight;
    }

    // ---------- Estatísticas de rolagens ----------
    // Popup sob demanda (não fica fixo na tela) com uma matriz dado x
    // jogador: uma linha por dado principal (d4/d6/d8/d10/d12/d20), uma
    // coluna por jogador, com a média dos valores individuais que aquele
    // jogador rolou daquele dado. Todo mundo vê a mesma tabela cheia (não
    // é um recorte "só o meu"), calculado em cima do que já está carregado
    // em `rolagens` — sem consulta nova ao banco. Reaproveita
    // TT_DICE.parseFormula pra saber, mesmo numa fórmula livre como
    // "2d6+1d4", quantos valores de resultado.dice pertencem a cada tipo
    // de dado (a ordem dos valores segue a ordem dos termos da fórmula,
    // igual TT_DICE.rollFormula monta esse array).
    const DADOS_PRINCIPAIS = [4, 6, 8, 10, 12, 20];
    function abrirEstatisticas() {
      document.getElementById('stats-content').innerHTML = montarEstatisticasHtml();
      document.getElementById('stats-backdrop').classList.add('aberto');
    }
    function fecharEstatisticas() {
      document.getElementById('stats-backdrop').classList.remove('aberto');
    }
    function fecharEstatisticasSeFundo(evt) {
      if (evt.target.id === 'stats-backdrop') fecharEstatisticas();
    }
    function montarEstatisticasHtml() {
      const validas = rolagens.filter(Boolean);
      // matriz[faces][nomeJogador] = { rolagens, soma }
      const matriz = {};
      DADOS_PRINCIPAIS.forEach(function (faces) { matriz[faces] = {}; });
      const totalPorJogador = {};
      validas.forEach(function (r) {
        const termos = TT_DICE.parseFormula(r.formula);
        if (!termos || !r.resultado || !r.resultado.dice) return;
        const nome = r.nome_exibicao || '?';
        let i = 0;
        termos.forEach(function (t) {
          if (!t.faces) return;
          for (let k = 0; k < t.n; k++) {
            const bruto = r.resultado.dice[i++];
            if (bruto === undefined) return;
            if (!matriz[t.faces]) return;
            if (!matriz[t.faces][nome]) matriz[t.faces][nome] = { rolagens: 0, soma: 0 };
            matriz[t.faces][nome].rolagens++;
            matriz[t.faces][nome].soma += Math.abs(bruto);
            totalPorJogador[nome] = (totalPorJogador[nome] || 0) + 1;
          }
        });
      });
      const jogadores = Object.keys(totalPorJogador).sort(function (a, b) { return totalPorJogador[b] - totalPorJogador[a]; });
      if (!jogadores.length) return '<p class="hint">Nenhuma rolagem de d4/d6/d8/d10/d12/d20 ainda nesta sessão.</p>';
      const cabecalho = '<th>Dado</th>' + jogadores.map(function (nome) { return '<th>' + escapeHtml(nome) + '</th>'; }).join('');
      const linhas = DADOS_PRINCIPAIS.map(function (faces) {
        const celulas = jogadores.map(function (nome) {
          const s = matriz[faces][nome];
          const media = s ? (s.soma / s.rolagens).toFixed(1) : '—';
          return '<td>' + media + '</td>';
        }).join('');
        return '<tr><td>d' + faces + '</td>' + celulas + '</tr>';
      }).join('');
      const totalRolagens = Object.keys(totalPorJogador).reduce(function (acc, nome) { return acc + totalPorJogador[nome]; }, 0);
      return '<div style="overflow-x:auto"><table class="stats-table">' +
        '<thead><tr>' + cabecalho + '</tr></thead>' +
        '<tbody>' + linhas + '</tbody></table></div>' +
        '<p class="hint" style="margin-top:10px">Baseado em ' + totalRolagens + ' rolagens de dados nesta sessão.</p>';
    }

    // ---------- Participantes (Presence) ----------
    function handlePresenceSync(state) {
      participantes = {};
      Object.keys(state).forEach(function (key) {
        (state[key] || []).forEach(function (meta) {
          participantes[meta.user_id || key] = meta.nome_exibicao || '?';
        });
      });
      renderParticipants();
    }
    function renderParticipants() {
      const el = document.getElementById('participant-list');
      if (!el) return;
      const ids = Object.keys(participantes);
      if (!ids.length) { el.innerHTML = '<p class="hint">Só você por aqui.</p>'; return; }
      el.innerHTML = ids.map(function (id) {
        const isGm = id === (sala && sala.gm_id);
        return '<div class="participant"><span class="dot"></span>' + escapeHtml(participantes[id]) + (isGm ? '<span class="gm-tag">MESTRE</span>' : '') + '</div>';
      }).join('');
    }

    // Delete/Backspace apaga o que estiver selecionado no laço — só quando
    // a ferramenta "Selecionar" está ativa e o foco não está num campo de
    // texto (pra não interferir com apagar letra em Anotações/Iniciativa/
    // nome do token).
    document.addEventListener('keydown', function (evt) {
      if (view !== 'room') return;
      if (evt.key === 'Escape') {
        const backdrop = document.getElementById('stats-backdrop');
        if (backdrop && backdrop.classList.contains('aberto')) fecharEstatisticas();
        return;
      }
      if (tool !== 'selecionar' || !selecionados.length) return;
      if (evt.key !== 'Delete' && evt.key !== 'Backspace') return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      evt.preventDefault();
      apagarSelecionados();
    });

    // Fecha o menu "Formas" ao clicar fora dele.
    document.addEventListener('click', function (evt) {
      if (view !== 'room') return;
      const dropdown = document.querySelector('.shapes-dropdown');
      if (dropdown && !dropdown.contains(evt.target)) fecharFormasMenu();
    });

    boot();
  </script>
</body>
