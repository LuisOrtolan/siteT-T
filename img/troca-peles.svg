<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- outer head circle -->
  <circle cx="32" cy="28" r="20" fill="rgba(192,152,88,0.07)" stroke="#c7a25a" stroke-width="1.5"/>
  <!-- dividing line (left=human, right=wolf) -->
  <line x1="32" y1="8" x2="32" y2="48" stroke="#c7a25a" stroke-width="1" opacity="0.5" stroke-dasharray="2,2"/>
  <!-- LEFT side: human eye + brow -->
  <path d="M20,24 Q23,21 26,24" fill="none" stroke="#c7a25a" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="23" cy="27" rx="3.5" ry="2.5" fill="none" stroke="#c7a25a" stroke-width="1.1"/>
  <circle cx="23" cy="27" r="1.2" fill="#c7a25a" opacity="0.5"/>
  <!-- LEFT: smooth jaw/chin -->
  <path d="M14,36 Q18,44 26,46 Q30,47 32,48" fill="none" stroke="#c7a25a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- RIGHT side: wolf eye (slanted) -->
  <path d="M38,22 Q41,19 44,22" fill="none" stroke="#c7a25a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M37,26 Q40,23 43,26 Q40,30 37,26 Z" fill="rgba(199,162,90,0.2)" stroke="#c7a25a" stroke-width="1"/>
  <ellipse cx="40" cy="26" rx="1.2" ry="1.8" fill="#c7a25a" opacity="0.5"/>
  <!-- RIGHT: wolf snout -->
  <path d="M32,36 Q38,38 44,34 Q46,40 40,46 Q36,48 32,48" fill="none" stroke="#c7a25a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- wolf ear (right) -->
  <polygon points="42,10 52,2 50,16" fill="rgba(199,162,90,0.1)" stroke="#c7a25a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- fang hint -->
  <line x1="38" y1="44" x2="40" y2="50" stroke="#c7a25a" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
  <!-- body below (transformation lines) -->
  <path d="M20,48 Q26,54 32,56 Q38,54 44,48" fill="none" stroke="#c7a25a" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <path d="M24,56 Q28,62 32,63 Q36,62 40,56" fill="none" stroke="#c7a25a" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
</svg>