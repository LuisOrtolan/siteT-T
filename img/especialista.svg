<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- key ring -->
  <circle cx="32" cy="18" r="13" fill="rgba(199,162,90,0.07)" stroke="#c7a25a" stroke-width="1.5"/>
  <!-- inner ring detail -->
  <circle cx="32" cy="18" r="6" fill="none" stroke="#c7a25a" stroke-width="0.8" opacity="0.45"/>
  <!-- shaft -->
  <line x1="32" y1="31" x2="32" y2="58" stroke="#c7a25a" stroke-width="2" stroke-linecap="round"/>
  <!-- bit (teeth) -->
  <line x1="32" y1="43" x2="42" y2="43" stroke="#c7a25a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="40" y2="51" stroke="#c7a25a" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="32" y1="57" x2="38" y2="57" stroke="#c7a25a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- bow hole -->
  <circle cx="27" cy="18" r="2.5" fill="none" stroke="#c7a25a" stroke-width="1"/>
</svg>