<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- bow stave (D-curve) -->
  <path d="M20,4 Q8,32 20,60" fill="none" stroke="#c7a25a" stroke-width="2" stroke-linecap="round"/>
  <!-- bowstring -->
  <line x1="20" y1="4" x2="20" y2="60" stroke="#c7a25a" stroke-width="0.9" stroke-dasharray="3,2" opacity="0.55"/>
  <!-- arrow shaft -->
  <line x1="20" y1="32" x2="58" y2="28" stroke="#c7a25a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- arrowhead -->
  <polygon points="58,28 51,24 52,31" fill="#c7a25a" opacity="0.7" stroke-width="0"/>
  <!-- fletching (3 lines at tail) -->
  <line x1="22" y1="32" x2="18" y2="26" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="32" x2="17" y2="31" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="32" x2="18" y2="37" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- nock -->
  <circle cx="21" cy="32" r="2" fill="none" stroke="#c7a25a" stroke-width="1"/>
</svg>