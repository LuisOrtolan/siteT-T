<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- flask body -->
  <path d="M22,32 L16,46 Q12,60 32,62 Q52,60 48,46 L42,32 Z"
        fill="rgba(80,200,120,0.1)" stroke="#c7a25a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- liquid surface inside -->
  <path d="M19,48 Q32,44 45,48" fill="none" stroke="#50c870" stroke-width="1" opacity="0.6"/>
  <!-- neck -->
  <path d="M24,18 L24,33 Q28,32 32,32 Q36,32 40,33 L40,18 Q36,16 32,16 Q28,16 24,18 Z"
        fill="rgba(199,162,90,0.06)" stroke="#c7a25a" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- cork -->
  <rect x="27" y="8" width="10" height="11" rx="2.5" fill="rgba(199,162,90,0.18)" stroke="#c7a25a" stroke-width="1.2"/>
  <!-- bubbles -->
  <circle cx="26" cy="53" r="3" fill="none" stroke="#50c870" stroke-width="1" opacity="0.55"/>
  <circle cx="35" cy="56" r="2" fill="none" stroke="#50c870" stroke-width="0.9" opacity="0.5"/>
  <circle cx="40" cy="50" r="2.5" fill="none" stroke="#50c870" stroke-width="0.9" opacity="0.45"/>
  <!-- vapor wisps from cork -->
  <path d="M30,8 Q28,4 30,1" fill="none" stroke="#c7a25a" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M34,8 Q36,3 34,0" fill="none" stroke="#c7a25a" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
</svg>