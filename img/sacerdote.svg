<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- rays (6 lines radiating from cup) -->
  <line x1="32" y1="14" x2="32" y2="6" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="14" x2="40" y2="8" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="14" x2="24" y2="8" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="32" y1="14" x2="44" y2="12" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="32" y1="14" x2="20" y2="12" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <!-- cup bowl -->
  <path d="M18,14 Q18,34 32,36 Q46,34 46,14 Z" fill="rgba(232,208,96,0.09)" stroke="#c7a25a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- liquid surface -->
  <path d="M21,22 Q32,19 43,22" fill="none" stroke="#c7a25a" stroke-width="0.9" opacity="0.4"/>
  <!-- stem -->
  <line x1="32" y1="36" x2="32" y2="52" stroke="#c7a25a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- node on stem -->
  <ellipse cx="32" cy="44" rx="4" ry="2.5" fill="rgba(199,162,90,0.13)" stroke="#c7a25a" stroke-width="1.1"/>
  <!-- base -->
  <path d="M20,56 Q24,52 32,52 Q40,52 44,56 L42,60 Q32,62 22,60 Z" fill="rgba(199,162,90,0.1)" stroke="#c7a25a" stroke-width="1.3" stroke-linejoin="round"/>
</svg>