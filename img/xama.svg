<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- outer hoop -->
  <circle cx="32" cy="24" r="16" fill="rgba(58,190,174,0.07)" stroke="#c7a25a" stroke-width="1.5"/>
  <!-- inner web lines (4 directions) -->
  <line x1="32" y1="10" x2="32" y2="38" stroke="#c7a25a" stroke-width="0.7" opacity="0.35"/>
  <line x1="18" y1="24" x2="46" y2="24" stroke="#c7a25a" stroke-width="0.7" opacity="0.35"/>
  <line x1="21" y1="13" x2="43" y2="35" stroke="#c7a25a" stroke-width="0.7" opacity="0.35"/>
  <line x1="43" y1="13" x2="21" y2="35" stroke="#c7a25a" stroke-width="0.7" opacity="0.35"/>
  <!-- center bead -->
  <circle cx="32" cy="24" r="4" fill="rgba(58,190,174,0.25)" stroke="#c7a25a" stroke-width="1.1"/>
  <!-- string hanging -->
  <line x1="32" y1="40" x2="32" y2="46" stroke="#c7a25a" stroke-width="1.1"/>
  <!-- feather 1 left -->
  <path d="M26,46 Q20,50 22,58" fill="none" stroke="#3abeae" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="22" y1="46" x2="26" y2="58" stroke="#3abeae" stroke-width="0.7" opacity="0.5"/>
  <!-- feather 2 center -->
  <path d="M32,46 Q28,52 30,61" fill="none" stroke="#c7a25a" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="29" y1="47" x2="33" y2="61" stroke="#c7a25a" stroke-width="0.7" opacity="0.5"/>
  <!-- feather 3 right -->
  <path d="M38,46 Q44,50 42,58" fill="none" stroke="#3abeae" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="42" y1="46" x2="38" y2="58" stroke="#3abeae" stroke-width="0.7" opacity="0.5"/>
  <!-- bead knots -->
  <circle cx="26" cy="46" r="1.5" fill="#c7a25a" opacity="0.7"/>
  <circle cx="32" cy="46" r="1.5" fill="#c7a25a" opacity="0.7"/>
  <circle cx="38" cy="46" r="1.5" fill="#c7a25a" opacity="0.7"/>
</svg>