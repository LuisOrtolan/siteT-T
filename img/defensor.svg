<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- shield outline -->
  <path d="M10,8 L54,8 L54,38 Q54,56 32,63 Q10,56 10,38 Z"
        fill="rgba(144,176,224,0.07)" stroke="#c7a25a" stroke-width="1.7" stroke-linejoin="round"/>
  <!-- top rim band -->
  <line x1="10" y1="18" x2="54" y2="18" stroke="#c7a25a" stroke-width="0.7" opacity="0.3"/>
  <!-- boss (center circle) -->
  <circle cx="32" cy="34" r="10" fill="rgba(199,162,90,0.1)" stroke="#c7a25a" stroke-width="1.2"/>
  <!-- cross inside boss -->
  <line x1="32" y1="26" x2="32" y2="42" stroke="#c7a25a" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <line x1="24" y1="34" x2="40" y2="34" stroke="#c7a25a" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <!-- center rivet -->
  <circle cx="32" cy="34" r="2.8" fill="#c7a25a" opacity="0.55"/>
  <!-- rivets on top edge (4) -->
  <circle cx="18" cy="11" r="1.5" fill="#c7a25a" opacity="0.4"/>
  <circle cx="26" cy="10" r="1.5" fill="#c7a25a" opacity="0.4"/>
  <circle cx="38" cy="10" r="1.5" fill="#c7a25a" opacity="0.4"/>
  <circle cx="46" cy="11" r="1.5" fill="#c7a25a" opacity="0.4"/>
</svg>