<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- blade -->
  <polygon points="34,4 31,52 34,56 37,52" fill="rgba(199,162,90,0.09)" stroke="#c7a25a" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- fuller -->
  <line x1="34" y1="9" x2="33" y2="50" stroke="#c7a25a" stroke-width="0.6" stroke-dasharray="3,2.5" opacity="0.45"/>
  <!-- crossguard -->
  <path d="M16,51 Q21,47 34,47 Q46,47 50,51" fill="none" stroke="#c7a25a" stroke-width="2" stroke-linecap="round"/>
  <!-- grip -->
  <rect x="31.5" y="51" width="5" height="9" rx="1.5" fill="rgba(199,162,90,0.13)" stroke="#c7a25a" stroke-width="1.2"/>
  <!-- grip wrap lines -->
  <line x1="31.5" y1="54" x2="36.5" y2="54" stroke="#c7a25a" stroke-width="0.6" opacity="0.4"/>
  <line x1="31.5" y1="57" x2="36.5" y2="57" stroke="#c7a25a" stroke-width="0.6" opacity="0.4"/>
  <!-- pommel -->
  <ellipse cx="34" cy="61" rx="5.5" ry="3" fill="rgba(199,162,90,0.15)" stroke="#c7a25a" stroke-width="1.3"/>
  <!-- tip gleam -->
  <circle cx="34" cy="5" r="1.3" fill="#c7a25a" opacity="0.65"/>
</svg>