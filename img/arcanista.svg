<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- staff shaft -->
  <line x1="36" y1="62" x2="30" y2="20" stroke="#c7a25a" stroke-width="1.9" stroke-linecap="round"/>
  <!-- orb housing ring -->
  <circle cx="28" cy="16" r="9" fill="rgba(130,80,220,0.1)" stroke="#c7a25a" stroke-width="1.5"/>
  <!-- inner orb -->
  <circle cx="28" cy="16" r="4.5" fill="rgba(180,120,255,0.18)" stroke="#c7a25a" stroke-width="0.9"/>
  <!-- ferule (bottom tip) -->
  <path d="M34,59 Q36,63 38,59" fill="none" stroke="#c7a25a" stroke-width="1.4" stroke-linecap="round"/>
  <!-- sparkle 1 (top) -->
  <line x1="28" y1="4" x2="28" y2="8" stroke="#c7a25a" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="23" y1="6" x2="25.5" y2="9" stroke="#c7a25a" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="33" y1="6" x2="30.5" y2="9" stroke="#c7a25a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- sparkle 2 (side) -->
  <line x1="42" y1="22" x2="39" y2="22" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="41" y1="18" x2="39" y2="20" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="41" y1="26" x2="39" y2="24" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>