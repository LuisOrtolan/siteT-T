<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- tablet stone shape -->
  <path d="M14,4 Q32,2 50,4 L52,52 Q32,58 12,52 Z"
        fill="rgba(96,144,224,0.08)" stroke="#c7a25a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- stone texture lines -->
  <line x1="16" y1="14" x2="48" y2="13" stroke="#c7a25a" stroke-width="0.5" opacity="0.2"/>
  <line x1="15" y1="46" x2="49" y2="47" stroke="#c7a25a" stroke-width="0.5" opacity="0.2"/>
  <!-- Tiwaz rune (↑ war/justice) in center — thick accent -->
  <line x1="32" y1="18" x2="32" y2="48" stroke="#c7e0ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="22" x2="22" y2="32" stroke="#c7e0ff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="22" x2="42" y2="32" stroke="#c7e0ff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- glow on rune -->
  <line x1="32" y1="18" x2="32" y2="48" stroke="white" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>
  <!-- crack detail -->
  <path d="M44,8 Q47,20 43,28" fill="none" stroke="#c7a25a" stroke-width="0.7" opacity="0.2" stroke-linecap="round"/>
</svg>