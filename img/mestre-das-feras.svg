<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- outer head shape -->
  <path d="M14,28 Q12,14 24,8 Q32,4 40,8 Q52,14 50,28 Q50,44 40,52 Q32,56 24,52 Q14,44 14,28 Z"
        fill="rgba(192,120,64,0.08)" stroke="#c7a25a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- ears -->
  <polygon points="16,16 12,4 24,12" fill="rgba(199,162,90,0.08)" stroke="#c7a25a" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="48,16 52,4 40,12" fill="rgba(199,162,90,0.08)" stroke="#c7a25a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- inner ear -->
  <polygon points="17,14 14,7 23,13" fill="rgba(192,120,64,0.2)" stroke="none"/>
  <polygon points="47,14 50,7 41,13" fill="rgba(192,120,64,0.2)" stroke="none"/>
  <!-- eyes -->
  <ellipse cx="24" cy="28" rx="4" ry="3" fill="rgba(199,162,90,0.2)" stroke="#c7a25a" stroke-width="1.2"/>
  <ellipse cx="40" cy="28" rx="4" ry="3" fill="rgba(199,162,90,0.2)" stroke="#c7a25a" stroke-width="1.2"/>
  <!-- pupils -->
  <ellipse cx="24" cy="28" rx="1.5" ry="2" fill="#c7a25a" opacity="0.6"/>
  <ellipse cx="40" cy="28" rx="1.5" ry="2" fill="#c7a25a" opacity="0.6"/>
  <!-- muzzle -->
  <path d="M24,38 Q32,44 40,38 Q38,34 32,33 Q26,34 24,38 Z" fill="rgba(199,162,90,0.1)" stroke="#c7a25a" stroke-width="1.1"/>
  <!-- nose -->
  <ellipse cx="32" cy="36" rx="3.5" ry="2" fill="#c7a25a" opacity="0.4"/>
  <!-- snout line -->
  <line x1="32" y1="38" x2="32" y2="42" stroke="#c7a25a" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>