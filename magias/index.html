<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilhas &amp; Tesouros - Magias &amp; Poderes</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <section class="section-card">
      <h1>Magias &amp; Poderes</h1>
      <p>
        Use os filtros abaixo para encontrar feitiços, músicas, milagres, rituais e outros
        poderes rapidamente durante o jogo.
      </p>

      <div class="filtros-magias">
        <label>
          Buscar por nome:
          <input type="text" id="busca-magia" placeholder="Digite o nome da magia..." />
        </label>

        <label>
          Filtrar por trilha:
          <select id="filtro-trilha">
            <option value="">Todas</option>
            <option value="Arcanista">Arcanista</option>
            <option value="Xamã">Xamã</option>
            <option value="Sacerdote">Sacerdote</option>
            <option value="Lorde Rúnico">Lorde Rúnico</option>
            <option value="Bardo">Bardo</option>
            <option value="Alquimista">Alquimista</option>
            <option value="Troca-peles">Troca-peles</option>
          </select>
        </label>

        <label>
          Filtrar por círculo/grau:
          <select id="filtro-circulo">
            <option value="">Todos</option>
            <option value="1">1º</option>
            <option value="2">2º</option>
            <option value="3">3º</option>
            <option value="4">4º</option>
            <option value="5">5º</option>
          </select>
        </label>
      </div>

      <section id="lista-magias" class="lista-magias">
        <!-- Magias serão renderizadas aqui via JS -->
      </section>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/magias.js"></script>
  <script src="../js/include.js"></script>
  <script>
    loadLayout("../");
  </script>
</body>
</html>
